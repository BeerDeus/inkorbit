# Branche « site » = le contenu de public/ seul, à la racine : c'est elle qu'Hostinger déploie (ink.manaorbit.app, déploiement Git statique,
# relancé à chaque push sur la branche). Mise à jour après chaque push sur main qui touche public/, et après le workflow « Données » (ses commits,
# faits avec GITHUB_TOKEN, ne déclenchent pas les autres workflows). Historique gardé (jamais de push forcé) : Hostinger ne fait que tirer.
name: Site
on:
  push:
    branches: [main]
    paths: ['public/**']
  workflow_run:
    workflows: [Données]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: site
  cancel-in-progress: false
jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Publier public/ sur la branche site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin site >/dev/null; then git worktree add -B site ../site origin/site; else git worktree add --orphan -b site ../site; fi
          rsync -a --delete --exclude .git public/ ../site/
          cd ../site
          git add -A
          if git diff --cached --quiet; then echo "rien de nouveau"; exit 0; fi
          git commit -m "Site : main $(git -C "$GITHUB_WORKSPACE" rev-parse --short HEAD)"
          git push origin site
