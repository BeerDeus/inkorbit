/* ── value.js : valeur de la collection dans le temps ──────────────────────────────────────────────────
   Un relevé par jour au plus (le jour où le fichier de prix change, ou la collection) : [jour, euros, dollars] en centimes, 400 jours au plus,
   dans localStorage (inkorbit:valhist). valueCurveSvg() dessine la courbe (accueil). */
const VAL = { hist: load('valhist', []) };
function valueNote() {
  if (!CARDS.ready) return;
  const day = dayKey(), eur = collValue(COLL.map, PRICES.p, 'EUR'), usd = collValue(COLL.map, PRICES.p, 'USD'), h = VAL.hist, last = h[h.length - 1];
  if (last && last[0] === day) { last[1] = eur; last[2] = usd; } else h.push([day, eur, usd]);
  if (h.length > 400) h.splice(0, h.length - 400);
  save('valhist', h);
}
document.addEventListener('io:data', valueNote);
onColl(() => { clearTimeout(VAL.t); VAL.t = setTimeout(valueNote, 800); });
/** Variation sur n jours (centimes) dans la devise des réglages, null si pas d'historique assez ancien. */
function valueDelta(days = 7) {
  const i = prefs().cur === 'USD' ? 2 : 1, h = VAL.hist; if (h.length < 2) return null;
  const since = dayKey(new Date(Date.now() - days * 864e5)), old = h.find(x => x[0] >= since) || h[0];
  return old === h[h.length - 1] ? null : h[h.length - 1][i] - old[i];
}
/** Courbe de la valeur (SVG, largeur 100 %) : 90 derniers jours ; une ligne plate tant qu'il n'y a qu'un relevé. */
function valueCurveSvg(w = 320, ht = 72) {
  const i = prefs().cur === 'USD' ? 2 : 1, pts = VAL.hist.slice(-90).map(x => x[i]);
  if (!pts.length) return '';
  if (pts.length === 1) pts.unshift(pts[0]);
  const lo = Math.min(...pts), hi = Math.max(...pts), span = hi - lo || 1;
  const xy = pts.map((v, k) => [(k / (pts.length - 1)) * w, ht - 6 - ((v - lo) / span) * (ht - 12)]);
  const d = xy.map(([x, y], k) => `${k ? 'L' : 'M'}${x.toFixed(1)} ${y.toFixed(1)}`).join('');
  return `<svg class="val-curve" viewBox="0 0 ${w} ${ht}" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="vcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".35"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>`
    + `<path d="${d}L${w} ${ht}L0 ${ht}Z" fill="url(#vcg)"/><path d="${d}" fill="none" stroke="var(--gold)" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/></svg>`;
}


/* ── trade.js : vue « Échange » (à échanger · je cherche · partager) et page publique d'une liste (?p=) ─────────────────────────
   · À échanger : les exemplaires au-delà de « Garder N » (réglage keep, 4 par défaut = un jeu complet), sauf les cartes gardées à la main (COLL.hold).
   · Je cherche : les souhaits (COLL.wants) moins ce qui est possédé (manquantes des decks, masterset, ajout à la main).
   · Partager : aucun serveur. La liste est compressée (deflate) dans le lien lui-même : https://<site>/?p=<base64url> ; QR code (qr.js) tant qu'il tient.
   · Un lien ?p= ouvert : la liste de l'autre joueur, et ce qui correspond à ma collection (il a ce que je cherche, je peux lui donner ce qu'il cherche). */
const TV = { tab: 'have', mode: load('tradeMode', 'grid'), el: null };
onView('trade', el => { TV.el = el; dataLoad().then(tradePaint, () => collFail(el)); if (!CARDS.ready) el.innerHTML = '<div class="sk" style="height:220px"></div>'; });
onColl(() => { if (curView() === 'trade' && TV.el) tradePaint(); });
const myLists = () => tradeLists(COLL.map, prefs().keep, COLL.hold, COLL.wants);
const listValue = (l, cur) => l.reduce((s, x) => s + x.n * priceFor(PRICES.p, x.id, x.foil >= x.n, cur), 0);

function tradePaint() {
  const el = TV.el; if (!el) return;
  const L = myLists(), cur = prefs().cur, keep = prefs().keep;
  el.innerHTML = `<div class="coll-head"><h1>${esc(T('Échange'))}</h1><p class="muted">${esc(TN(L.have.reduce((s, x) => s + x.n, 0), '{n} carte à échanger', '{n} cartes à échanger'))} · ${esc(TN(L.want.length, '{n} recherchée', '{n} recherchées'))}</p></div>

/* ── Partager ───────────────────────────────────────────────────────────────────────────────── */
async function deflate(text) { const s = new Blob([text]).stream().pipeThrough(new CompressionStream('deflate-raw')); return new Uint8Array(await new Response(s).arrayBuffer()); }

const siteUrl = () => location.origin + location.pathname.replace(/index\.html$/, '');
async function tradeLink(L) { return `${siteUrl()}?p=${b64u(await deflate(tradePack({ name: prefs().name, cur: prefs().cur, have: L.have, want: L.want })))}`; }
function tradeShareTab(body, L) {
  body.innerHTML = `<div class="panel">
      <div class="field"><label for="trName">${esc(T('Ton pseudo (affiché sur ta liste)'))}</label><input id="trName" class="input" maxlength="40" value="${esc(prefs().name)}" placeholder="${esc(T('Ex. Martin'))}"></div>
      <div class="tr-qr" aria-live="polite"><div class="sk" style="width:220px;height:220px"></div></div>
      <div class="btn-row"><button type="button" class="btn btn-primary" data-share><svg class="i"><use href="#i-share"/></svg>${esc(T('Partager le lien'))}</button><button type="button" class="btn" data-copy><svg class="i"><use href="#i-copy"/></svg>${esc(T('Copier'))}</button></div>
      <p class="muted small">${esc(T('Le lien contient toute ta liste (à échanger et recherchées) : rien n\'est envoyé sur un serveur. Partage-le à nouveau quand ta collection change.'))}</p></div>`;
  let link = '';
  const make = async () => {
    link = await tradeLink(L);
    let qr = ''; try { qr = qrSvg(link).svg; } catch (e) { qr = `<p class="muted small">${esc(T('Liste trop longue pour un QR code : partage le lien.'))}</p>`; }
    $('.tr-qr', body).innerHTML = qr;
  };
  $('#trName', body).addEventListener('change', e => { setPref('name', e.target.value.trim()); make(); });
  body.addEventListener('click', async e => {
    if (!link) return;
    if (e.target.closest('[data-copy]')) { try { await navigator.clipboard.writeText(link); toast(T('Lien copié')); } catch (err) { prompt(T('Copie ce lien'), link); } }
    if (e.target.closest('[data-share]')) { try { await navigator.share({ title: T('Ma liste d\'échange Ink Orbit'), url: link }); } catch (err) { if (err && err.name !== 'AbortError') { try { await navigator.clipboard.writeText(link); toast(T('Lien copié')); } catch (e2) { /* ignore */ } } } }
  });
  make().catch(() => { $('.tr-qr', body).innerHTML = `<p class="bad">${esc(T('Ton navigateur ne sait pas compresser la liste.'))}</p>`; });
}

/* ── Page publique (?p=…) ───────────────────────────────────────────────────────────────────── */
async function openPublicTrade(p) {
  let L = null;
  try { L = tradeUnpack(await inflate(unb64u(p))); } catch (e) { L = null; }
  if (!L) { toast(T('Ce lien d\'échange est abîmé.')); return; }
  await dataLoad();
  const m = tradeMatch(myLists(), L), mine = Object.keys(COLL.map).length > 0;
  let tab = m.forMe.length ? 'match' : 'have';
  const el = openScreen({ title: L.name ? T('Liste de {name}', { name: L.name }) : T('Liste d\'échange'), cls: 'pub-screen', html: '<div class="pub-host"></div>' });
  const host = $('.pub-host', el);
  const paint = () => {
    host.innerHTML = `${mine ? `<div class="panel da-frame pub-match"><p><b>${esc(TN(m.forMe.length, '{n} carte que tu cherches', '{n} cartes que tu cherches'))}</b> · ${esc(TN(m.forThem.length, '{n} carte que tu peux lui proposer', '{n} cartes que tu peux lui proposer'))}</p></div>` : ''}
      <div class="tabs" role="tablist">${[...(mine ? [['match', T('Pour moi')], ['give', T('Je peux donner')]] : []), ['have', T('À échanger')], ['want', T('Cherche')]].map(([k, l]) => `<button type="button" role="tab" data-t="${k}" aria-selected="${tab === k}">${esc(l)}</button>`).join('')}</div>
      <div>${tradeItemsHtml(tab === 'match' ? m.forMe : tab === 'give' ? m.forThem : tab === 'have' ? L.have : L.want, 'pub', 'grid')}</div>`;
  };
  host.addEventListener('click', e => { const t = e.target.closest('[data-t]'); if (t) { tab = t.dataset.t; paint(); } });
  paint();
}


/* ── qr.js : QR codes (lien de la liste d'échange), repris de Mana Orbit ─────────────────────────────────────
   Encodeur autonome, sans réseau ni bibliothèque : mode octets (UTF-8), correction M (≈ 15 % du code peut manquer), versions 1 à 20
   (jusqu'à 666 octets ; un lien de partage en fait ≈ 50 → version 4, une liste compressée jusqu’à ≈ 600), masque choisi par les pénalités de la norme ISO/IEC 18004.
   Rendu : un SVG à un seul chemin, modules carrés, marge de 4 modules (zone de silence). Vérifié par tests/test-qr.mjs
   (matrices de référence d'un autre encodeur, et décodage complet : format, masque, Reed-Solomon, texte). */
const QR_EC_M = [0, 10, 16, 26, 18, 24, 16, 18, 22, 22, 26, 30, 22, 22, 24, 24, 28, 28, 26, 26, 26];      // niveau M : codes correcteurs par bloc, par version (1 à 20)
const QR_BLOCKS_M = [0, 1, 1, 1, 2, 2, 4, 4, 4, 5, 5, 5, 8, 9, 9, 10, 10, 11, 13, 14, 16];           // niveau M : nombre de blocs Reed-Solomon, par version

const qrRaw = v => { let r = (16 * v + 128) * v + 64; if (v >= 2) { const a = Math.floor(v / 7) + 2; r -= (25 * a - 10) * a - 55; if (v >= 7) r -= 36; } return r; };

/** Produit dans GF(256), polynôme x⁸ + x⁴ + x³ + x² + 1 (0x11D). */
function qrMul(x, y) { let z = 0; for (let i = 7; i >= 0; i--) { z = (z << 1) ^ ((z >>> 7) * 0x11D); z ^= ((y >>> i) & 1) * x; } return z; }

function qrEncode(text) {

  if (v > 20) throw new Error('QR : texte trop long (' + bytes.length + ' octets)');
  const cap = qrDataCap(v), bits = [], put = (x, n) => { for (let i = n - 1; i >= 0; i--) bits.push((x >>> i) & 1); };
  put(4, 4); put(bytes.length, v < 10 ? 8 : 16); for (const b of bytes) put(b, 8);      // mode octets (0100), longueur, octets
  put(0, Math.min(4, cap * 8 - bits.length)); put(0, (8 - bits.length % 8) % 8);       // fin de message, puis octet complet
  const data = []; for (let i = 0; i < bits.length; i += 8) data.push(bits.slice(i, i + 8).reduce((a, b) => a * 2 + b, 0));
  for (let p = 0xEC; data.length < cap; p ^= 0xEC ^ 0x11) data.push(p);                  // remplissage 0xEC, 0x11, 0xEC…
  const nb = QR_BLOCKS_M[v], ec = QR_EC_M[v], total = Math.floor(qrRaw(v) / 8), short = nb - total % nb, len = Math.floor(total / nb), div = qrDivisor(ec), blocks = [];
  for (let i = 0, k = 0; i < nb; i++) { const d = data.slice(k, k += len - ec + (i < short ? 0 : 1)); blocks.push([d, qrRemainder(d, div)]); }      // blocs courts d'abord, les longs ont un octet de plus
  const cw = [];
  for (let i = 0; i <= len - ec; i++) for (const [d] of blocks) if (i < d.length) cw.push(d[i]);
  for (let i = 0; i < ec; i++) for (const [, e] of blocks) cw.push(e[i]);

}
/** Centres des motifs d'alignement (lignes et colonnes). */
function qrAlign(v) {

function qrPenalty(m) {

    // faux repère 1:1:3:1:1 (foncé, clair, foncé ×3, clair, foncé), à toute échelle k, bordé de clair : ≥ 4k d'un côté, ≥ k de l'autre (le bord du code compte comme clair)
    const r = [n]; let c = 0;      // plages alternées, la première claire (bord)
    for (let i = 0; i < n; i++) { const v = get(i); if (v === c) r[r.length - 1]++; else { r.push(1); c = v; } }
    if (c) r.push(n); else r[r.length - 1] += n;

  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) { dark += m[y][x]; if (x && y && m[y][x] === m[y - 1][x] && m[y][x] === m[y][x - 1] && m[y][x] === m[y - 1][x - 1]) p += 3; }

/** Texte → { v, n (côté en modules), mask, m : lignes de Uint8Array (1 = foncé) }. mask : 0 à 7 pour l'imposer (tests), sinon le meilleur. */
function qrMatrix(text, mask) {
  const { v, cw } = qrEncode(text), n = v * 4 + 17;

  for (let i = 0; i < n; i++) { set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }      // motifs de synchronisation
  for (const [cx, cy] of [[3, 3], [n - 4, 3], [3, n - 4]]) for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {      // repères (et leur bordure claire)
    const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy)); if (x >= 0 && x < n && y >= 0 && y < n) set(x, y, d !== 2 && d !== 4);
  }

  al.forEach((a, i) => al.forEach((b, j) => { if ((!i && !j) || (!i && j === last) || (i === last && !j)) return; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) set(a + dx, b + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1); }));
  const format = k => {      // niveau M (00) + masque, BCH(15,5), XOR 0x5412 ; deux copies, et le module toujours foncé
    let r = k; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((k << 10) | r) ^ 0x5412, bit = i => (b >>> i) & 1;
    for (let i = 0; i <= 5; i++) set(8, i, bit(i));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for (let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
    for (let i = 0; i < 8; i++) set(n - 1 - i, 8, bit(i));
    for (let i = 8; i < 15; i++) set(8, n - 15 + i, bit(i));
    set(8, n - 8, 1);
  };
  format(0);      // réserve les emplacements avant de placer les données
  if (v >= 7) {      // version (BCH 18,6), deux copies
    let r = v; for (let i = 0; i < 12; i++) r = (r << 1) ^ ((r >>> 11) * 0x1F25);
    const b = (v << 12) | r; for (let i = 0; i < 18; i++) { const d = (b >>> i) & 1, a = n - 11 + i % 3, c = Math.floor(i / 3); set(a, c, d); set(c, a, d); }
  }
  let i = 0;      // données : colonnes de 2 en zigzag depuis le coin bas droit, la colonne 6 (synchronisation) sautée
  for (let right = n - 1; right >= 1; right -= 2) {
    if (right === 6) right = 5;
    for (let vert = 0; vert < n; vert++) for (let j = 0; j < 2; j++) {

    }

  let best = Number.isInteger(mask) && mask >= 0 && mask < 8 ? mask : -1;
  if (best < 0) {

    for (let k = 0; k < 8; k++) { apply(k); format(k); const p = qrPenalty(m); if (p < low) { low = p; best = k; } apply(k); }      // le masque s'annule en le réappliquant
  }
  apply(best); format(best);
  return { v, n, mask: best, m };
}
/** SVG du QR code : fond blanc, modules noirs (un lecteur attend du foncé sur clair, thème sombre compris), marge de 4 modules. */

  return { n: s, svg: `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${s} ${s}" shape-rendering="crispEdges" aria-hidden="true"><rect width="${s}" height="${s}" fill="#fff"/><path d="${d}" fill="#000"/></svg>` };
}

if (typeof module !== 'undefined' && module.exports) module.exports = { qrEncode, qrMatrix, qrSvg, qrPenalty, qrDataCap };


/* ── binder.js : classeur d'échange (pages de 3 × 3 pochettes, comme un vrai classeur) ─────────────────────────────────────
   Pages côte à côte, défilement horizontal aimanté (scroll-snap : le doigt tourne les pages, rien à programmer) ; numéro de page en bas.
   Une pochette par carte (quantité en badge) ; foil : liseré irisé. */
function binderHtml(items) {
  const pages = [];
  for (let i = 0; i < items.length; i += 9) pages.push(items.slice(i, i + 9));
  return `<div class="binder" data-cards>${pages.map((p, k) => `<div class="bnd-page" aria-label="${esc(T('Page {n} sur {m}', { n: k + 1, m: pages.length }))}"><div class="bnd-grid">${p.map(o => `<div class="bnd-pocket${o.foil ? ' is-foil' : ''}">${thumbHtml(o.c, { qty: o.n })}</div>`).join('')}${'<div class="bnd-pocket is-empty"></div>'.repeat(9 - p.length)}</div><p class="bnd-no muted small">${k + 1} / ${pages.length}</p></div>`).join('')}</div>`;
}


/* ── masterset.js : extensions et masterset ──────────────────────────────────────────────────────────
   · msListHtml() : les extensions (la plus récente d'abord) avec la progression de la collection (cartes de base différentes possédées / taille de l'extension).
   · openSet(code) : toutes les cartes de l'extension dans l'ordre des numéros (possédées en couleur, manquantes grisées), progression de base et complète
     (Enchantées, Épiques, Iconiques comprises), en foil si demandé ; filtres Toutes / Possédées / Manquantes et rareté ; souhaiter les manquantes. */
const setCards = code => CARDS.list.filter(c => c.set === code).sort((a, b) => parseInt(a.num, 10) - parseInt(b.num, 10) || String(a.num).localeCompare(String(b.num)));
/** Progression d'une extension : { base, baseOwn, all, allOwn, miss (centimes de ce qui manque, normales) }. foil : ne compter que les foils. */
function setProgress(code, foil = false) {
  const own = collById(COLL.map), s = CARDS.setsByCode.get(code), base = (s && s.base) || 0, cur = prefs().cur;
  let baseOwn = 0, all = 0, allOwn = 0, miss = 0;
  for (const c of setCards(code)) {
    const o = own.get(c.id), has = o && (foil ? o.foil : o.n) > 0, isBase = parseInt(c.num, 10) <= base && !/[a-z]$/.test(c.num);
    all++; if (has) allOwn++; if (isBase && has) baseOwn++;
    if (!has) miss += priceFor(PRICES.p, c.id, foil, cur);
  }
  return { base: base || all, baseOwn, all, allOwn, miss };
}
const ringSvg = p => `<svg class="ms-ring" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="15.5" class="ms-ring-bg"/>${p > 0 ? `<circle cx="18" cy="18" r="15.5" class="ms-ring-fg" stroke-dasharray="${(p * 97.4).toFixed(1)} 97.4"/>` : ''}</svg>`;
function msListHtml() {
  const sets = CARDS.sets.filter(s => s.type === 'expansion' || s.type === 'quest').slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  return `<div class="list ms-list">${sets.map(s => { const p = setProgress(s.code), r = p.base ? p.baseOwn / p.base : 0; return `<button type="button" class="row" data-set="${esc(s.code)}">
    <span class="ms-ring-w">${ringSvg(r)}<b class="num">${Math.round(r * 100)}</b></span>
    <span class="row-main"><span class="row-title">${esc(s.name)}</span><span class="row-sub">${esc(s.type === 'quest' ? T('Quête des Illumineurs') : T('Extension {n}', { n: s.code }))} · ${fmtNum(p.baseOwn)}/${fmtNum(p.base)}</span></span>
    <svg class="i"><use href="#i-chev"/></svg></button>`; }).join('')}</div>`;
}
document.addEventListener('click', e => { const b = e.target.closest('[data-set]'); if (b && !b.closest('.ms-screen')) openSet(b.dataset.set); });

const MS = { f: 'all', rar: '', foil: false };
function openSet(code) {
  const s = CARDS.setsByCode.get(code); if (!s) return;
  const el = openScreen({ title: s.name, cls: 'ms-screen', html: '<div class="ms-host"></div>' });
  const host = $('.ms-host', el);
  const paint = () => {
    const own = collById(COLL.map), p = setProgress(code, MS.foil), cur = prefs().cur;
    const has = c => { const o = own.get(c.id); return !!o && (MS.foil ? o.foil : o.n) > 0; };
    const cards = setCards(code).filter(c => (MS.rar === '' || c.rar === +MS.rar) && (MS.f === 'all' || (MS.f === 'own') === has(c)));
    const rars = [...new Set(setCards(code).map(c => c.rar))].sort((a, b) => a - b);
    const missing = setCards(code).filter(c => !has(c));
    host.innerHTML = `<div class="ms-head da-frame">
        <div class="ms-big">${ringSvg(p.base ? p.baseOwn / p.base : 0)}<div><b class="num">${fmtNum(p.baseOwn)}<small>/${fmtNum(p.base)}</small></b><span class="muted small">${esc(T('cartes de base'))}</span></div></div>
        <p class="muted small">${esc(T('Complète : {a}/{b} avec les Enchantées, Épiques et Iconiques', { a: fmtNum(p.allOwn), b: fmtNum(p.all) }))}${p.miss ? ' · ' + esc(T('Ce qui manque : {v}', { v: fmtMoney(p.miss, cur) })) : ''}</p>
      </div>
      <div class="seg" role="group">${[['all', T('Toutes')], ['own', T('Possédées')], ['miss', T('Manquantes')]].map(([k, l]) => `<button type="button" data-f="${k}" aria-pressed="${MS.f === k}">${esc(l)}</button>`).join('')}</div>
      <div class="chips"><button type="button" class="chip" data-rar="" aria-pressed="${MS.rar === ''}">${esc(T('Toutes raretés'))}</button>${rars.map(r => `<button type="button" class="chip" data-rar="${r}" aria-pressed="${MS.rar === String(r)}"><i class="rar-dot" data-rar="${RAR_KEYS[r]}"></i>${esc(RAR_NAMES()[r])}</button>`).join('')}</div>
      <label class="switch"><input type="checkbox" data-foil${MS.foil ? ' checked' : ''}><span>${esc(T('Masterset foil'))} ✦</span></label>
      <div class="grid-cards" data-cards>${cards.map(c => { const o = own.get(c.id); return thumbHtml(c, { missing: !has(c), qty: o ? (MS.foil ? o.foil : o.n) : 0, foil: o && o.foil > 0, cap: `${esc(c.num)} · <b class="num">${fmtMoney(priceFor(PRICES.p, c.id, MS.foil, cur), cur)}</b>` }); }).join('') || `<p class="muted">${esc(T('Aucune carte'))}</p>`}</div>
      ${missing.length ? `<button type="button" class="btn btn-block" data-wish><svg class="i"><use href="#i-heart"/></svg>${esc(TN(missing.length, 'Ajouter la carte manquante à mes recherches', 'Ajouter les {n} cartes manquantes à mes recherches'))}</button>` : `<p class="good">${esc(T('Extension complète ✦'))}</p>`}`;
  };
  host.addEventListener('click', e => {
    const f = e.target.closest('[data-f]'); if (f) { MS.f = f.dataset.f; paint(); return; }
    const r = e.target.closest('.chip[data-rar]'); if (r) { MS.rar = r.dataset.rar; paint(); return; }
    if (e.target.closest('[data-wish]')) {
      const own = collById(COLL.map), before = { ...COLL.wants }; let n = 0;
      for (const c of setCards(code)) { const o = own.get(c.id); if (!(o && (MS.foil ? o.foil : o.n) > 0) && !COLL.wants[c.id]) { COLL.wants[c.id] = 1; n++; } }
      collSave(); toast(TN(n, '{n} carte ajoutée à tes recherches', '{n} cartes ajoutées à tes recherches'), { action: T('Annuler'), onAction: () => { COLL.wants = before; collSave(); } });
    }
  });
  host.addEventListener('change', e => { if (e.target.matches('[data-foil]')) { MS.foil = e.target.checked; paint(); } });
  const off = () => paint(); collSubs.add(off);
  const close = el.close; el.close = () => { collSubs.delete(off); close(); };
  paint();
}


/* ── decks.js : « Mes decks » (vue Decks), éditeur de deck, import d'une decklist, « Prix d'une liste » ─────────────────────────────
   Stockage : load('decks') = [{ id, name, cards: { <id de carte>: n }, at }] (localStorage, inkorbit:decks). Pas de decks méta externes :
   seulement ceux de l'utilisateur, plus deux liens sortants pour trouver des idées.
   · Liste : chaque deck en carte (illustration = sa carte la plus chère, encres, n/60, valeur, cartes à trouver contre la collection).
   · Éditeur (plein écran) : onglets Deck · Ajouter · Collection ; règles du format (deckCheck) affichées en continu ; courbe des coûts,
     part encrable, types ; manquantes en grisé → « Ajouter à mes recherches » ; export texte. Ordinateur : deck à gauche, recherche à droite.
   Fonctions pures (deckCurve, deckCanAdd, deckValue) : tests/test-decks.mjs. */

/* ── Logique pure ─────────────────────────────────────────────────────────────────────────────── */
/** Clé « même carte » pour la limite d'exemplaires : nom complet (anglais s'il est chargé, comme deckCheck). */
const deckNameKey = c => normName(c.nameEn ? `${c.nameEn} ${c.verEn || ''}` : fullName(c));
/** Courbe des coûts (cases 1 à 7+ : indices 1 à 7, un coût 0 compte dans la case 1), encrables, types. */
function deckCurve(deck, byId) {
  const curve = [0, 0, 0, 0, 0, 0, 0, 0], types = [0, 0, 0, 0]; let inkable = 0, total = 0;
  for (const [id, n] of Object.entries(deck)) {
    const c = byId.get(+id); if (!c || !(n > 0)) continue;
    total += n; curve[Math.min(Math.max(c.cost, 1), 7)] += n; types[c.type] = (types[c.type] || 0) + n; if (c.inkwell) inkable += n;
  }
  return { curve, types, inkable, total };
}
/** Peut-on ajouter un exemplaire de c ? (4 au plus d'un même nom complet, toutes impressions, sauf exception imprimée c.max). */
function deckCanAdd(deck, byId, c) {
  const k = deckNameKey(c); let n = 0;
  for (const [id, q] of Object.entries(deck)) { const x = byId.get(+id); if (x && deckNameKey(x) === k) n += q; }
  return n < (c.max || DECK_COPIES);
}
/** Valeur du deck et de ce qui manque (centimes, prix normal ; repli foil). */
function deckValue(deck, byId, prices, cur, map) {
  let value = 0, missingValue = 0, missing = 0;
  for (const [id, n] of Object.entries(deck)) if (byId.get(+id)) value += n * priceFor(prices, +id, false, cur);
  for (const m of deckMissing(deck, map)) { missing += m.need; missingValue += m.need * priceFor(prices, m.id, false, cur); }
  return { value, missing, missingValue };
}
/** Carte de couverture : la plus chère du deck (sinon la première). */
function deckCover(deck, byId, prices, cur) {
  let best = null, bp = -1;
  for (const id of Object.keys(deck)) { const c = byId.get(+id); if (!c) continue; const p = priceFor(prices, +id, false, cur); if (p > bp) { bp = p; best = c; } }
  return best;
}
/** Decklist analysée (parseDeck) → { <id>: n }. */
const deckFromParsed = parsed => { const d = {}; for (const [c, n] of parsed.cards) d[c.id] = (d[c.id] || 0) + n; return d; };

if (typeof module !== 'undefined' && module.exports) module.exports = { deckNameKey, deckCurve, deckCanAdd, deckValue, deckCover, deckFromParsed };

/* ── Interface ────────────────────────────────────────────────────────────────────────────────── */
const DK = { list: null, el: null, ed: null };
const dkList = () => DK.list || (DK.list = load('decks', []));
function dkSave() { save('decks', dkList()); }
const dkFind = id => dkList().find(d => d.id === id);
const dkNewId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dkCur = () => prefs().cur;
const dkInkPips = inks => inks.map(i => `<svg class="ink-sym" data-ink="${INK_KEYS[i]}" aria-label="${esc(INK_NAMES()[i])}"><use href="#ink-${INK_KEYS[i]}"/></svg>`).join('');

function dkCreate(name, cards = {}) {
  const d = { id: dkNewId(), name: String(name || '').trim().slice(0, 60) || T('Nouveau deck'), cards, at: Date.now() };
  dkList().unshift(d); dkSave(); return d;
}
function dkTouch(d) { d.at = Date.now(); dkSave(); }

/** Vue « Decks » : la liste. */
function dkListPaint() {

    const img = cover && cardImg(cover, 'normal');
    return `<article class="dk-card" data-deck="${esc(d.id)}">

        <span class="dk-card-main">

          <span class="dk-card-meta"><span class="dk-inks">${dkInkPips(chk.inks)}</span><span class="num${chk.total >= DECK_MIN ? '' : ' warn'}">${esc(T('{n}/60 cartes', { n: chk.total }))}</span>${v.value ? `<span class="num">${fmtMoney(v.value, cur)}</span>` : ''}</span>
          <span class="dk-card-own ${v.missing ? '' : 'ok'}">${v.missing ? esc(TN(v.missing, '{n} carte à trouver', '{n} cartes à trouver')) + (v.missingValue ? ` · ${fmtMoney(v.missingValue, cur)}` : '') : chk.total ? esc(T('Toutes les cartes sont dans ta collection')) : esc(T('Deck vide'))}</span>
        </span>

    ${list.length ? `<div class="dk-cards">${cardsHtml}</div>` : `<div class="empty"><svg class="i"><use href="#i-deck"/></svg><h3>${esc(T('Aucun deck pour l\'instant'))}</h3><p>${esc(T('Crée un deck de 60 cartes à une ou deux encres, ou colle une liste trouvée ailleurs.'))}</p></div>`}
    <div class="dk-ideas"><div class="da-rule"><span>${esc(T('Trouver des idées de decks'))}</span></div>
    <p class="small muted"><a href="https://inkdecks.com/" target="_blank" rel="noopener">inkdecks.com</a> · <a href="https://lorcana.gg/" target="_blank" rel="noopener">lorcana.gg</a> — ${esc(T('copie une liste puis « Importer une liste »'))}</p></div>`;
}

function dkMount(el) {
  if (DK.el === el) { dkListPaint(); return; }
  DK.el = el;
  el.addEventListener('click', e => {
    const t = e.target;
    if (t.closest('[data-dk-new]')) { dkNameSheet(T('Nouveau deck'), '', name => dkOpen(dkCreate(name).id)); return; }
    if (t.closest('[data-dk-import]')) { dkImportSheet(); return; }
    if (t.closest('[data-dk-price]')) { dkPriceSheet(); return; }
    const o = t.closest('[data-dk-open]'); if (o) { dkOpen(o.dataset.dkOpen); return; }
    const m = t.closest('[data-dk-more]'); if (m) dkMoreSheet(m.dataset.dkMore);
  });
  dkListPaint();
  dataLoad().then(dkListPaint, () => { el.innerHTML = `<div class="empty"><svg class="i"><use href="#i-offline"/></svg><h3>${esc(T('Catalogue indisponible'))}</h3><p>${esc(T('Vérifie ta connexion puis réessaie.'))}</p></div>`; });
}

/* ── Feuilles : nom, actions, import, prix d'une liste ─────────────────────────────────────────── */
function dkNameSheet(title, value, done) {
  const el = openSheet({ title, html: `<form class="dk-form"><div class="field"><label for="dkName">${esc(T('Nom du deck'))}</label><input id="dkName" class="input" maxlength="60" autocomplete="off" autofocus value="${esc(value)}" placeholder="${esc(T('Ambre-Améthyste chansons'))}"></div><button class="btn btn-primary btn-block" type="submit">${esc(T('Enregistrer'))}</button></form>` });

}
function dkMoreSheet(id) {
  const d = dkFind(id); if (!d) return;
  const el = openSheet({ title: d.name, html: `<div class="list">
    <button type="button" class="row" data-a="open"><svg class="i"><use href="#i-edit"/></svg><span class="row-main"><span class="row-title">${esc(T('Modifier'))}</span></span></button>
    <button type="button" class="row" data-a="rename"><svg class="i"><use href="#i-book"/></svg><span class="row-main"><span class="row-title">${esc(T('Renommer'))}</span></span></button>
    <button type="button" class="row" data-a="dup"><svg class="i"><use href="#i-copy"/></svg><span class="row-main"><span class="row-title">${esc(T('Dupliquer'))}</span></span></button>
    <button type="button" class="row" data-a="export"><svg class="i"><use href="#i-share"/></svg><span class="row-main"><span class="row-title">${esc(T('Exporter la liste'))}</span></span></button>
    <button type="button" class="row dk-danger" data-a="del"><svg class="i"><use href="#i-trash"/></svg><span class="row-main"><span class="row-title">${esc(T('Supprimer'))}</span></span></button></div>` });
  el.addEventListener('click', e => {
    const a = e.target.closest('[data-a]'); if (!a) return;
    const act = a.dataset.a; el.close();
    if (act === 'open') dkOpen(id);
    else if (act === 'rename') dkNameSheet(T('Renommer'), d.name, v => { d.name = String(v).trim().slice(0, 60) || d.name; dkTouch(d); dkListPaint(); });

function dkDeleteSheet(d) {
  const el = openSheet({ title: T('Supprimer ce deck ?'), html: `<p>${esc(T('« {name} » sera supprimé de cet appareil. Ta collection ne change pas.', { name: d.name }))}</p><div class="btn-row"><button type="button" class="btn btn-danger" data-yes>${esc(T('Supprimer'))}</button><button type="button" class="btn btn-ghost" data-close>${esc(T('Annuler'))}</button></div>` });

async function dkExport(d) {
  try { await dataEn(); } catch (e) { /* hors ligne : noms de la langue des cartes */ }
  const text = deckToText(d.cards, CARDS.byId);
  if (navigator.share) { try { await navigator.share({ title: d.name, text }); return; } catch (e) { if (e && e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(text); toast(T('Liste copiée')); } catch (e) {
    const el = openSheet({ title: T('Exporter la liste'), html: `<textarea class="input" readonly rows="12">${esc(text)}</textarea>` }); $('textarea', el).select();

/** Lignes non reconnues d'une decklist. */
const dkBadHtml = bad => (bad.length ? `<div class="dk-bad"><p class="small"><b>${esc(TN(bad.length, '{n} ligne non reconnue', '{n} lignes non reconnues'))}</b></p><ul>${bad.slice(0, 30).map(l => `<li>${esc(l)}</li>`).join('')}</ul></div>` : '');
async function dkParse(text) { await dataLoad(); try { await dataEn(); } catch (e) { /* noms anglais indisponibles hors ligne */ } return parseDeck(text, CARDS.ix); }
function dkImportSheet() {
  const el = openSheet({ title: T('Importer une liste'), html: `<form class="dk-form">

function dkPriceSheet() {
  const el = openSheet({ title: T('Prix d\'une liste'), html: `<p class="muted small">${esc(T('Colle une liste pour voir son prix et ce qui manque à ta collection, sans l\'enregistrer.'))}</p>

function dkEdClick(st, e) {

  if (tab) {

    for (const b of $$('.dk-tabs [data-tab]', st.el)) b.setAttribute('aria-selected', String(b.dataset.tab === st.tab));
    for (const p of $$('.dk-pane', st.el)) p.classList.toggle('on', p.dataset.pane === st.tab);
    if (st.tab !== 'deck') dkSearchPaint(st, st.tab); else if (matchMedia('(min-width:1024px)').matches) dkSearchPaint(st, 'add');
    return;
  }
  const step = t.closest('[data-step]');
  if (step) {
    const c = CARDS.byId.get(+step.dataset.id), dir = +step.dataset.step; if (!c) return;
    if (dir > 0 && !deckCanAdd(d.cards, CARDS.byId, c)) { toast(T('{name} : 4 exemplaires au plus', { name: c.name })); return; }
    const n = Math.max(0, (d.cards[c.id] || 0) + dir); if (n) d.cards[c.id] = n; else delete d.cards[c.id];
    dkTouch(d); st.paint(); return;
  }
  const ink = t.closest('.dk-ink-chips [data-ink]'); if (ink) { st.ink = st.ink === ink.dataset.ink ? '' : ink.dataset.ink; dkSearchPaint(st, st.tab === 'coll' ? 'coll' : 'add'); return; }
  const g = t.closest('[data-group]'); if (g) { st.group = g.dataset.group; save('dkGroup', st.group); dkDeckPaint(st); return; }
  if (t.closest('[data-wants]')) {
    const miss = deckMissing(d.cards, COLL.map);
    for (const m of miss) COLL.wants[m.id] = Math.max(COLL.wants[m.id] || 0, d.cards[m.id]);
    collSave(); toast(TN(miss.length, '{n} carte ajoutée à tes recherches', '{n} cartes ajoutées à tes recherches')); st.paint(); return;
  }
  if (t.closest('[data-export]')) { dkExport(d); return; }
  if (t.closest('[data-rename]')) dkNameSheet(T('Renommer'), d.name, v => { d.name = String(v).trim().slice(0, 60) || d.name; dkTouch(d); const h = $('.screen-head h2', st.el); if (h) h.textContent = d.name; });
}

/* ── scan.js : scanner des cartes (vue Scanner) ────────────────────────────────────────────────────────────────────
   · Caméra arrière dans un cadre, gabarit d'une carte (63:88) : la carte posée dans le gabarit est lue sur l'appareil (Tesseract.js, chargé à la demande

     ou l'appli. Sans caméra (permission refusée, ordinateur) : une photo choisie (champ fichier).
   · Lecture : la ligne du bas à gauche (« 123/204 • FR • 7 » : numéro, langue, extension) → la carte exacte et la langue de l'exemplaire (core.js › parseFootLine).
     Illisible (bouton « Lire » seulement) : la bande du nom (« ARIEL / Sur des jambes humaines ») comparée aux noms du catalogue (nameSim ≥ 0,75).
     « Auto » : la ligne du bas est relue en boucle tant que la vue est ouverte ; une même carte lue deux fois de suite en moins de 3 s ne compte qu'une fois.
   · Mode « Ajouter » : chaque carte lue arrive dans le lot (gardé sur l'appareil : inkorbit:scanlot) ; « Ajouter N cartes à ma collection ».
     Mode « Prix rapide » : la carte lue s'ouvre en grand, rien n'est ajouté. */

const CARD_RATIO = 63 / 88;

const NAME_BOX = { x: 0.03, y: 0.54, w: 0.66, h: 0.085 };      // nom (capitales, blanc) et version, à gauche de la force et de la volonté
const NAME_SHIFTS = [0, -0.02, 0.02, -0.035, 0.035];      // décalages essayés (fractions de la hauteur de la carte)
const FOOT_CHARS = '0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZabcde.-•·';

const ANY_CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyzÀÂÄÇÉÈÊËÎÏÔÖÙÛÜŸàâäçéèêëîïôöùûüÿßÆæŒœ0123456789/' + "'’-.,!?&:•·«»+ ";
const SC = { el: null, stream: null, video: null, mode: 'add', auto: true, busy: false, last: null, lot: typeof load === 'function' ? load('scanlot', []) : [], worker: null, wait: null, loop: 0, msg: '' };

/* ── Logique pure (tests/test-scan.mjs) ─────────────────────────────────────────────────────────── */
/** Gabarit de la carte dans un cadre w × h : centré, fill de la hauteur (ou de la largeur si le cadre est étroit). */
function guideRect(w, h, fill = 0.84) {
  const ch = Math.min(h * fill, (w * fill) / CARD_RATIO), cw = ch * CARD_RATIO;
  return { x: (w - cw) / 2, y: (h - ch) / 2, w: cw, h: ch };
}
/** Vidéo affichée en object-fit: cover dans un cadre cw × ch : rectangle du cadre → rectangle de l'image vidéo (vw × vh). */
function coverMap(r, cw, ch, vw, vh) {
  const s = Math.max(cw / vw, ch / vh), ox = (cw - vw * s) / 2, oy = (ch - vh * s) / 2;
  return { x: (r.x - ox) / s, y: (r.y - oy) / s, w: r.w / s, h: r.h / s };

/** Zone d'une carte (box en fractions) dans l'image, bornée à l'image. */
function subRect(card, box, iw = Infinity, ih = Infinity) {

function footCard(f, ix) {

/** Texte lu dans la bande du nom → meilleure carte : { card, sim }. Compare le nom complet (nom + version) et le nom seul, dans la langue des cartes et en anglais.
 *  À ressemblance égale : l'impression la plus ancienne de base (ni Enchantée, ni promo). ponytail: balaie tout le catalogue (≈ 3 600 × distance d'édition, < 50 ms). */
function bestName(text, cards) {

  // La bande peut aussi attraper la ligne des classifications ou un bout d'illustration : chaque paire de lignes voisines (nom + version) et chaque ligne seule.
  const pairs = lines.slice(0, -1).map((l, i) => l + ' ' + lines[i + 1]);

/** Ligne du bas illisible en entier : langue, extension et chiffres collés (« 205204 », « 11204 ») lus quand même. */
function footLoose(t) {
  const m = /(\d[\d/]{0,7})\W{0,4}(?<![A-Z])(FR|EN|DE|IT)(?![A-Z])\W{0,4}(\d{1,2}|Q\d)\b/.exec(footClean(t).replace(/(?<=\d)[|lI]|[|lI](?=\d)/g, '1').replace(/V(?=\d)/g, '/'));      // « l » ou « I » collés aux chiffres : 1 ; « V204 » : /204 (jamais le I de « IT »)
  const lang = (/(?<![A-Z])(FR|EN|DE|IT)(?![A-Z])/.exec(t || '') || [])[1];
  return { lang: lang ? lang.toLowerCase() : '', set: m ? m[3] : '', digits: m ? m[1].replace(/\D/g, '') : '' };
}
/** Impression d'un nom reconnu : parmi les cartes du même nom complet, celle de l'extension lue dont le numéro ouvre les chiffres lus. */
function namePrint(card, loose, cards) {

/** Niveaux de gris, contraste étiré, texte clair sur fond sombre inversé (Tesseract lit mieux du noir sur blanc). Agit sur un tableau RGBA.

/* ── lore.js : compteur de lore (partie sur une table, tout est local : aucun jeu en ligne) ──────────────────────────────────────
   · openLore() : écran plein. 2 joueurs face à face (la moitié du haut tournée de 180°), ou 3-4 joueurs (rangée du haut tournée).
     Toucher la moitié droite d'un joueur : +1, la gauche : −1 ; appui long : ±5, répété tant que le doigt reste.
   · Objectif réglable (20 par défaut) ; victoire : étincelles et « Revanche ». Annuler (n'importe quelle action), tour et joueur actif.
   · État gardé (inkorbit:lore) et repris ; écran gardé allumé (Wake Lock) ; vibration courte.
   La logique (loreNew, loreAct, loreNext, loreUndo) est pure : tests/test-games.mjs. */

const LORE_MAX = 99, LORE_LOG = 300;
/** Nouvelle partie ; prev : partie d'avant (noms, encres, objectif gardés : « Revanche »). */
function loreNew(n = 2, goal = 20, prev) {
  const inks = [4, 3, 1, 2], names = ['Joueur 1', 'Joueur 2', 'Joueur 3', 'Joueur 4'];
  const players = Array.from({ length: Math.min(4, Math.max(2, n)) }, (_, i) => {
    const p = prev && prev.players[i];
    return { name: p ? p.name : (typeof T === 'function' ? T(names[i]) : names[i]), ink: p ? p.ink : inks[i], lore: 0 };
  });
  return { goal: Math.min(LORE_MAX, Math.max(1, goal | 0 || 20)), players, turn: 1, cur: 0, log: [], winner: -1 };
}
const loreCopy = s => ({ ...s, players: s.players.map(p => ({ ...p })), log: s.log.slice() });
const loreWinner = s => s.players.findIndex(p => p.lore >= s.goal);
/** Joueur p gagne (d > 0) ou perd (d < 0) du lore, borné de 0 à 99. Rien après la victoire. */
function loreAct(s, p, d) {
  if (s.winner >= 0 || !s.players[p] || !d) return s;
  const o = loreCopy(s), pl = o.players[p], v = Math.min(LORE_MAX, Math.max(0, pl.lore + d));
  if (v === pl.lore) return s;
  o.log.push({ p, d: v - pl.lore }); if (o.log.length > LORE_LOG) o.log.shift();
  pl.lore = v; o.winner = loreWinner(o);
  return o;
}
/** Joueur suivant ; retour au premier : tour suivant. */
function loreNext(s) {
  if (s.winner >= 0) return s;
  const o = loreCopy(s); o.log.push({ t: 1, cur: o.cur });
  o.cur = (o.cur + 1) % o.players.length; if (o.cur === 0) o.turn++;
  return o;
}
function loreUndo(s) {
  if (!s.log.length) return s;
  const o = loreCopy(s), a = o.log.pop();
  if (a.t) { if (o.cur === 0) o.turn = Math.max(1, o.turn - 1); o.cur = a.cur; }
  else o.players[a.p].lore -= a.d;
  o.winner = loreWinner(o);
  return o;
}

/* ── mystery.js : « Carte mystère », la carte du jour à deviner (tout est sur l'appareil : ni serveur, ni classement) ───────────────
   · Même carte pour tout le monde le même jour (jour à Paris, dayKey) : tirée parmi les cartes ayant une image Lorcast, hors promos.
   · 6 essais : l'image se dévoile pixelisée puis de plus en plus nette (canvas : dessinée toute petite puis agrandie sans lissage ;
     l'image vient d'un autre site, la toile est « teintée » : on ne lit jamais ses pixels), avec un indice de plus à chaque erreur.
   · Trouvée ou 6 essais : la carte en grand, score, série de jours, « Partager », compte à rebours jusqu'à minuit à Paris.

const MYS_TRIES = 6;

  const sq = Array.from({ length: MYS_TRIES }, (_, i) => (i < st.tries.length ? (st.won && i === st.tries.length - 1 ? '🟩' : '🟪') : '⬛')).join('');
  return `${T('Carte mystère')} ${st.day} · ${st.won ? `${st.tries.length}/${MYS_TRIES}` : `X/${MYS_TRIES}`}\n${sq}${url ? '\n' + url : ''}`;

/** Secondes jusqu'à minuit à Paris (prochaine carte). */

/* ── Interface ──────────────────────────────────────────────────────────────────────────────── */
const MYS = { el: null, card: null, img: null, tick: 0 };
const mysKey = c => normName(fullName(c));
/** Partie du jour (gardée) : { day, tries, done, won }, pour la tuile de l'accueil. */

function mysHints(c, step) {

  if (step >= 2) h.push([T('Coût'), String(c.cost)]);

}
function openMystery() {

function mysPaint() {

    ${mysHints(c, st.done ? 5 : step).length ? `<dl class="mys-hints">${mysHints(c, st.done ? 5 : step).map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('')}</dl>` : ''}
    ${tries.length ? `<ol class="mys-tries">${tries.map((t, i) => `<li class="${st.won && i === tries.length - 1 ? 'ok' : 'ko'}">${esc(fullName(t))}</li>`).join('')}</ol>` : ''}`;
  mysDraw();

  if (inp) {

    const run = () => {

/** Dessine l'étape : l'image réduite à MYS_PIX[étape] pixels de large, puis agrandie sans lissage ; finie : nette. */

/* ── Connexion ───────────────────────────────────────────────────────────────────────────────── */
function authMessage(e) {

  const m = {
    'auth/invalid-email': T('Adresse e-mail invalide.'), 'auth/missing-password': T('Saisis ton mot de passe.'),
    'auth/invalid-credential': T('E-mail ou mot de passe incorrect.'), 'auth/wrong-password': T('E-mail ou mot de passe incorrect.'), 'auth/user-not-found': T('E-mail ou mot de passe incorrect.'),

    'auth/too-many-requests': T('Trop d\'essais. Réessaie dans quelques minutes.'), 'auth/network-request-failed': T('Pas de connexion. Réessaie une fois en ligne.'),
    'auth/popup-blocked': T('Fenêtre bloquée par le navigateur : autorise-la, ou utilise ton e-mail.'), 'auth/popup-closed-by-user': null, 'auth/cancelled-popup-request': null,
    'auth/unauthorized-domain': T('Ce site n\'est pas autorisé dans Firebase (Authentication › Paramètres › Domaines autorisés).'),
    'auth/requires-recent-login': T('Reconnecte-toi, puis recommence.'), 'auth/user-disabled': T('Ce compte est désactivé.'),
  };
  return c in m ? m[c] : T('Connexion impossible ({code}).', { code: c.replace('auth/', '') || '?' });
}
async function signGoogle() {

/* ── Synchro ─────────────────────────────────────────────────────────────────────────────────── */
function localDoc() {

  return { v: 1, coll: load('coll', {}), wants: load('wants', {}), hold: load('hold', {}), decks: load('decks', []), prefs: Object.fromEntries(SYNC_PREFS.filter(k => k in p).map(k => [k, p[k]])) };
}
/** Applique un document à l'appareil sans le renvoyer (clés locales, mémoire des modules, écrans). */
function applyDoc(d) {
  CLOUD.applying = true;
  try {
    save('coll', d.coll || {}); save('wants', d.wants || {}); save('hold', d.hold || {}); save('decks', d.decks || []);
    if (d.prefs) save('prefs', { ...load('prefs', {}), ...d.prefs });
    COLL.map = load('coll', {}); COLL.wants = load('wants', {}); COLL.hold = load('hold', {});
    if (typeof DK !== 'undefined') DK.list = null;
    collSave();

  } finally { CLOUD.applying = false; }
}
/** Appelée par data.js › save : une clé suivie a changé sur cet appareil. */
function cloudTouch(k) {
  if (!SYNC_KEYS.includes(k) || CLOUD.applying || !syncMeta().uid) return;      // SYNC_KEYS d'abord : save('dev') tourne pendant la création de CLOUD
  if (!syncMeta().dirty) setSync({ dirty: true });

}
async function cloudPush() {

  const u = CLOUD.user; if (!u || !CLOUD.m) return;
  const { fs } = CLOUD.m, at = Date.now();
  CLOUD.state = 'saving'; cloudEmit();
  try { await fs.setDoc(fs.doc(CLOUD.db, 'users', u.uid, 'data', 'main'), { ...localDoc(), at, dev: CLOUD.dev }); setSync({ uid: u.uid, at, dirty: false }); CLOUD.state = 'ok'; }
  catch (e) { CLOUD.state = 'error'; console.warn('Synchro :', e && e.code); }

}
/** Document reçu (ouverture de la session, ou changement venu d'un autre appareil). */
async function cloudRemote(d, uid) {
  const s = syncMeta(), local = localDoc();
  if (!d) { await cloudPush(); return; }                                                     // compte neuf : l'appareil l'initialise
  if (d.dev === CLOUD.dev && d.at <= (s.at || 0)) return;                                    // écho de notre propre écriture
  const fresh = s.uid !== uid;                                                                // premier branchement de cet appareil sur ce compte
  if ((fresh || s.dirty) && hasData(local)) {
    const m = mergeDocs(local, d); applyDoc(m); setSync({ uid, at: d.at, dirty: true }); await cloudPush();
    if (fresh) toast(T('Les cartes de cet appareil ont été ajoutées à ton compte.'));
    return;
  }
  if (d.at > (s.at || 0) || fresh) { applyDoc(d); setSync({ uid, at: d.at, dirty: false }); }
  CLOUD.state = 'ok'; cloudEmit();
}
function cloudUser(u) {
  if (CLOUD.unsub) { CLOUD.unsub(); CLOUD.unsub = null; }
  CLOUD.user = u || null; CLOUD.state = u ? 'loading' : 'off'; save('authRedirect', 0); cloudEmit();
  if (!u) return;
  const { fs } = CLOUD.m;
  CLOUD.unsub = fs.onSnapshot(fs.doc(CLOUD.db, 'users', u.uid, 'data', 'main'),
    snap => { if (!snap.metadata.hasPendingWrites) cloudRemote(snap.exists() ? snap.data() : null, u.uid).catch(e => console.warn(e)); },
    e => { CLOUD.state = 'error'; cloudEmit(); console.warn('Synchro :', e && e.code); });
}

    ${inst === 'ready' || inst === 'ios' ? `<div class="da-rule"><span>${esc(T('Appli'))}</span></div><button type="button" class="btn btn-primary" data-install>${esc(T('Installer Ink Orbit'))}</button>${inst === 'ios' ? `<p class="muted small">${esc(T('Sur iPhone : bouton Partager, puis « Sur l\'écran d\'accueil ».'))}</p>` : ''}` : ''}
    <div class="list"><button type="button" class="row" data-act="about"><svg class="i"><use href="#i-info"/></svg><span class="row-main"><span class="row-title">${esc(T('À propos et mentions'))}</span><span class="row-sub">${esc(T('Version {v}', { v: typeof IO_BUILD !== 'undefined' ? IO_BUILD : 'dev' }))}</span></span><svg class="i"><use href="#i-chev"/></svg></button></div>` });
  const repaint = () => { const h = $('.acct-host', el); if (h) h.innerHTML = cloudAccountHtml(); };
  CLOUD.subs.add(repaint);
  const close = el.close; el.close = () => { CLOUD.subs.delete(repaint); close(); };
  el.addEventListener('click', async e => {
    const b = e.target.closest('[data-pref] [data-v]');
    if (b) { const k = b.closest('[data-pref]').dataset.pref; setPref(k, b.dataset.v); $$('[data-v]', b.parentElement).forEach(x => x.setAttribute('aria-pressed', x === b)); if (k === 'theme') themeApply(); else collSave(); return; }
    if (e.target.closest('[data-backup]')) downloadText(`ink-orbit-sauvegarde-${dayKey()}.json`, JSON.stringify({ app: 'ink-orbit', v: 1, at: new Date().toISOString(), data: Object.fromEntries(BACKUP_KEYS.map(k => [k, load(k, null)]).filter(([, v]) => v != null)) }), 'application/json');
    if (e.target.closest('[data-install]')) PWA.install();
  });
  el.addEventListener('change', async e => {
    if (e.target.matches('[data-ui]')) { try { localStorage.setItem('inkorbit:lang', e.target.value); } catch (err) { /* ignore */ } location.reload(); }
    if (e.target.matches('[data-clang]')) { setPref('clang', e.target.value); location.reload(); }
    if (e.target.matches('[data-restore]')) {
      const f = e.target.files[0]; if (!f) return;
      try {
        const j = JSON.parse(await f.text()); if (j.app !== 'ink-orbit' || !j.data) throw new Error('format');
        if (!confirm(T('Remplacer les données de cet appareil par cette sauvegarde du {d} ?', { d: new Date(j.at).toLocaleDateString(LOC()) }))) return;
        for (const k of BACKUP_KEYS) if (k in j.data) save(k, j.data[k]);
        location.reload();
      } catch (err) { toast(T('Ce fichier n\'est pas une sauvegarde Ink Orbit.')); }
    }
  });
}

/* ── pwa.js : installation de l'appli et service worker (modèle : Mana Orbit) ──────────────────────────────────────────────
   Chrome / Edge / Android : « beforeinstallprompt » est gardé, PWA.install() ouvre la vraie fenêtre d'installation.
   iPhone / iPad : seulement « Sur l'écran d'accueil » (rien à déclencher) → état 'ios', l'appli explique le geste.
   sw.js : enregistré seulement en http(s) et s'il existe vraiment (aperçu, fichier local : l'appli marche sans).
   Nouvelle version : le service worker dit quelle page il garde (message « io-shell ») ; différente de celle qui tourne (IO_BUILD) → toast « Recharger ». */
const PWA = (() => {
  let deferred = null, installed = false;
  const subs = new Set();
  const mq = q => { try { return matchMedia(q).matches; } catch (e) { return false; } };
  const standalone = () => mq('(display-mode: standalone)') || mq('(display-mode: minimal-ui)') || navigator.standalone === true;
  const ios = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const emit = () => subs.forEach(f => { try { f(); } catch (e) { /* ignore */ } });
  /** standalone : déjà ouverte comme une appli · installed : installée à l'instant · ready : installation possible · ios · manual : menu du navigateur */
  const state = () => standalone() ? 'standalone' : installed ? 'installed' : deferred ? 'ready' : ios() ? 'ios' : 'manual';
  async function install() {
    if (!deferred) return 'none';
    const d = deferred; deferred = null; emit();             // l'événement ne sert qu'une fois
    try { await d.prompt(); const r = await d.userChoice; return (r && r.outcome) || 'dismissed'; } catch (e) { return 'error'; }
  }
  const on = f => { subs.add(f); return () => subs.delete(f); };

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; emit(); });
  window.addEventListener('appinstalled', () => { installed = true; deferred = null; emit(); toast(T('Ink Orbit est installée')); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    let told = false;
    navigator.serviceWorker.addEventListener('message', e => {
      const b = e.data && e.data.type === 'io-shell' && e.data.build;
      if (!b || b === IO_BUILD || told) return;
      told = true;
      toast(T('Nouvelle version d\'Ink Orbit'), { action: T('Recharger'), onAction: () => location.reload(), ms: 12000 });
    });
    const go = async () => {
      try {
        const r = await fetch('sw.js', { method: 'HEAD', cache: 'no-store' });
        if (!r.ok || !/javascript|ecmascript/i.test(r.headers.get('content-type') || '')) return;
        await navigator.serviceWorker.register('sw.js', { scope: './' });
        const c = navigator.serviceWorker.controller; if (c) c.postMessage({ type: 'io-shell?' });
      } catch (e) { /* jamais gênant : l'appli marche sans service worker */ }
    };
    if (document.readyState === 'complete') go(); else window.addEventListener('load', go);
  }
  return { state, install, on, standalone, ios };
})();


/* ── main.js : démarrage ─────────────────────────────────────────────────────────────────────── */
uiInit();
