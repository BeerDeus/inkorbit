<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Ta collection de cartes Lorcana, tes decks et leur valeur. Appli de fan gratuite et non officielle.">
<meta name="theme-color" content="#140f2e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ink Orbit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Ink Orbit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..800,100,1&family=Nunito+Sans:opsz,wght@6..12,400..800&display=swap">
<style>
/* ── theme.css : direction artistique d'Ink Orbit (docs/da/README.md) ─────────────────────────────────────────────
   « Livre de contes, la nuit » : ciel indigo → violet, filigranes d'or chaud, encre et aquarelle. Jetons : docs/contrat.md (noms à respecter).
   Nuit par défaut (:root) ; html[data-theme="light"] : Parchemin ; html[data-theme="dark"] : la nuit forcée (même valeurs que :root). */
:root{
  --bg:#120d2e; --bg-2:#2a1756; --surface:#1d1745; --surface-2:#282056; --surface-3:#171138; --line:#3b3074;
  --ink:#f5f0fd; --ink-2:#cfc5ea; --ink-3:#a99dce;      /* ink-3 ≥ 4,5:1 sur --bg, --surface et --surface-2 */
  --gold:#e9c47c; --gold-2:#c99a45; --gold-soft:rgba(233,196,124,.14);
  --accent:#b9a2ff; --accent-ink:#150f33; --accent-soft:#2e2566; --ring:rgba(185,162,255,.42);
  --good:#62d6a6; --good-soft:#15342e; --warn:#f2bb63; --warn-soft:#3a2b14; --bad:#ff8c9c; --bad-soft:#3d1a2a;
  --scrim:rgba(6,3,20,.66);
  --shadow:0 1px 2px rgba(4,2,16,.45),0 12px 30px -14px rgba(4,2,16,.8);
  --shadow-lg:0 2px 6px rgba(4,2,16,.5),0 28px 60px -20px rgba(4,2,16,.9);
  --r-lg:22px; --r-md:15px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --out:cubic-bezier(.16,1,.3,1); --spring:cubic-bezier(.34,1.5,.5,1);
  --font-display:'Fraunces','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --font-body:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --font-num:'Nunito Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  /* Les six encres (nos teintes, nos symboles : src/icons.html › ink-*) */
  --amber:#f3aa3c; --amethyst:#a274ee; --emerald:#33b27a; --ruby:#ea4c63; --sapphire:#3f97e6; --steel:#a3afc0;
  --amber-soft:rgba(243,170,60,.16); --amethyst-soft:rgba(162,116,238,.18); --emerald-soft:rgba(51,178,122,.16);
  --ruby-soft:rgba(234,76,99,.16); --sapphire-soft:rgba(63,151,230,.17); --steel-soft:rgba(163,175,192,.16);
  /* Raretés : du plus discret au plus précieux */
  --r-common:#bdb4d6; --r-uncommon:#8fd3b4; --r-rare:#7fb2ff; --r-super:#c595ff; --r-legendary:#ffd27a;
  --r-epic:#ff86bd; --r-enchanted:#86ecff; --r-iconic:#fff0b8; --r-special:#ffa877;
  --sky:radial-gradient(120% 80% at 80% -10%,#4a2a8c 0%,transparent 55%),radial-gradient(90% 70% at -10% 30%,#2a1f72 0%,transparent 60%),linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 62%);
  --foil:linear-gradient(115deg,#ffd27a 0%,#ff9ec9 26%,#b9a2ff 52%,#86ecff 76%,#ffd27a 100%);
  color-scheme:dark;
}
:root[data-theme="dark"]{ color-scheme:dark; }
:root[data-theme="light"]{
  --bg:#f5eedf; --bg-2:#ece1c9; --surface:#fffaf0; --surface-2:#efe5d0; --surface-3:#f9f3e6; --line:#d8c9a8;
  --ink:#2a1b46; --ink-2:#4b3b6d; --ink-3:#66567f;
  --gold:#8a5d14; --gold-2:#6e4a10; --gold-soft:rgba(138,93,20,.12);      /* or bruni : ≥ 4,5:1 sur --bg et --surface */
  --accent:#5a3db2; --accent-ink:#ffffff; --accent-soft:#e7def8; --ring:rgba(90,61,178,.3);
  --good:#137a52; --good-soft:#dcf1e6; --warn:#97600a; --warn-soft:#f8ebcf; --bad:#b4334a; --bad-soft:#f8e0e4;
  --scrim:rgba(42,27,70,.42);
  --shadow:0 1px 2px rgba(60,40,20,.08),0 10px 26px -14px rgba(60,40,20,.28);
  --shadow-lg:0 2px 6px rgba(60,40,20,.1),0 26px 56px -22px rgba(60,40,20,.35);
  --amber:#d98a12; --amethyst:#7f4fd6; --emerald:#1f9461; --ruby:#cf3550; --sapphire:#2479c9; --steel:#6f7d91;
  --r-common:#8d84a6; --r-uncommon:#3f9a74; --r-rare:#3f74cf; --r-super:#8a55d6; --r-legendary:#b98114;
  --r-epic:#cc3f84; --r-enchanted:#1f93b3; --r-iconic:#a98a1c; --r-special:#c4602b;
  --sky:radial-gradient(110% 70% at 85% -10%,#f3e3bf 0%,transparent 55%),radial-gradient(80% 60% at -10% 40%,#efe0f0 0%,transparent 60%),linear-gradient(180deg,var(--bg-2) 0%,var(--bg) 60%);
  color-scheme:light;
}

/* ── Classes décoratives (préfixe da-) ──────────────────────────────────────────────────────────────────── */
/* Ciel étoilé : à poser sur un conteneur positionné (body, en-tête d'accueil…). Deux couches d'étoiles en dégradés, une étincelle qui scintille. */
.da-sky{position:relative;isolation:isolate;background:var(--sky)}
.da-sky::before,.da-sky::after{content:'';position:absolute;inset:0;z-index:-1;pointer-events:none;background-repeat:repeat}
.da-sky::before{background-image:
  radial-gradient(1px 1px at 12% 18%,#fff 60%,transparent),radial-gradient(1px 1px at 68% 9%,#fff 60%,transparent),
  radial-gradient(1.2px 1.2px at 84% 34%,#ffe9b8 60%,transparent),radial-gradient(1px 1px at 31% 46%,#fff 60%,transparent),
  radial-gradient(1px 1px at 52% 72%,#d9ccff 60%,transparent),radial-gradient(1.4px 1.4px at 7% 81%,#fff 60%,transparent),
  radial-gradient(1px 1px at 91% 88%,#fff 60%,transparent),radial-gradient(1px 1px at 41% 24%,#ffe9b8 60%,transparent);
  background-size:260px 260px;opacity:.55}
.da-sky::after{background-image:
  radial-gradient(1.6px 1.6px at 22% 30%,#fff 55%,transparent),radial-gradient(1.4px 1.4px at 76% 58%,#ffe2a0 55%,transparent),
  radial-gradient(1.2px 1.2px at 58% 16%,#fff 55%,transparent),radial-gradient(1.8px 1.8px at 36% 84%,#e3d8ff 55%,transparent);
  background-size:410px 410px;animation:da-twinkle 5.5s ease-in-out infinite alternate}
:root[data-theme="light"] .da-sky::before,:root[data-theme="light"] .da-sky::after{opacity:.0}
@keyframes da-twinkle{from{opacity:.25}to{opacity:.85}}

/* Étincelle à quatre branches (élément vide : <i class="da-spark"></i>) */
.da-spark{display:inline-block;width:12px;height:12px;background:var(--gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);filter:drop-shadow(0 0 4px var(--gold-soft));animation:da-spark 3.2s ease-in-out infinite}
@keyframes da-spark{0%,100%{transform:scale(.7) rotate(0);opacity:.6}50%{transform:scale(1) rotate(45deg);opacity:1}}

/* Filet doré : <div class="da-rule"><i></i></div> (losange au centre) ou <div class="da-rule"><span>Titre</span></div> */
.da-rule{display:flex;align-items:center;gap:10px;color:var(--gold);margin:0}
.da-rule::before,.da-rule::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
.da-rule::after{background:linear-gradient(270deg,transparent,var(--gold))}
.da-rule>i{width:7px;height:7px;background:var(--gold);transform:rotate(45deg);box-shadow:0 0 8px var(--gold-soft)}
.da-rule>span{font:700 11px/1 var(--font-body);letter-spacing:.18em;text-transform:uppercase}

/* Cadre filigrane : double liseré doré et coins ornés (cartes mises en avant, valeur de la collection) */
.da-frame{position:relative;border-radius:var(--r-lg);background:linear-gradient(var(--surface),var(--surface)) padding-box,linear-gradient(140deg,var(--gold),transparent 30%,transparent 70%,var(--gold)) border-box;border:1px solid transparent;box-shadow:var(--shadow)}
.da-frame::before{content:'';position:absolute;inset:5px;border-radius:calc(var(--r-lg) - 5px);border:1px solid var(--gold-soft);pointer-events:none}
.da-frame::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:
  radial-gradient(circle at 12px 12px,var(--gold) 1.6px,transparent 2.4px),radial-gradient(circle at calc(100% - 12px) 12px,var(--gold) 1.6px,transparent 2.4px),
  radial-gradient(circle at 12px calc(100% - 12px),var(--gold) 1.6px,transparent 2.4px),radial-gradient(circle at calc(100% - 12px) calc(100% - 12px),var(--gold) 1.6px,transparent 2.4px)}

/* Tache d'encre / aquarelle : halo coloré derrière un contenu (data-ink pour la teinte, accent par défaut) */
.da-ink{position:relative;isolation:isolate}
.da-ink::before{content:'';position:absolute;inset:-18% -12%;z-index:-1;pointer-events:none;filter:blur(18px);opacity:.55;
  background:radial-gradient(40% 46% at 34% 42%,var(--da-c,var(--accent)) 0%,transparent 70%),radial-gradient(30% 36% at 68% 62%,var(--da-c2,var(--sapphire)) 0%,transparent 72%),radial-gradient(18% 20% at 78% 26%,var(--gold) 0%,transparent 70%)}

/* Pastille d'encre : petit disque teinté (filtres, listes) ; <i class="da-pip" data-ink="ruby"></i> */
.da-pip{--c:var(--ink-3);display:inline-block;width:12px;height:12px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 40%,#fff) 0 18%,var(--c) 55%,color-mix(in srgb,var(--c) 70%,#000) 100%);box-shadow:0 0 0 1.5px color-mix(in srgb,var(--c) 35%,transparent)}
.da-pip[data-ink="amber"],.da-ink[data-ink="amber"]{--c:var(--amber);--da-c:var(--amber)}
.da-pip[data-ink="amethyst"],.da-ink[data-ink="amethyst"]{--c:var(--amethyst);--da-c:var(--amethyst)}
.da-pip[data-ink="emerald"],.da-ink[data-ink="emerald"]{--c:var(--emerald);--da-c:var(--emerald)}
.da-pip[data-ink="ruby"],.da-ink[data-ink="ruby"]{--c:var(--ruby);--da-c:var(--ruby)}
.da-pip[data-ink="sapphire"],.da-ink[data-ink="sapphire"]{--c:var(--sapphire);--da-c:var(--sapphire)}
.da-pip[data-ink="steel"],.da-ink[data-ink="steel"]{--c:var(--steel);--da-c:var(--steel)}

/* Titre façon livre de contes (Fraunces doux et « wonky ») */
.da-title{font-family:var(--font-display);font-weight:700;font-variation-settings:'SOFT' 100,'WONK' 1;letter-spacing:-.01em;line-height:1.05}

@media (prefers-reduced-motion: reduce){
  .da-sky::after,.da-spark{animation:none}
}

/* Ink Orbit — coque : téléphone d'abord, une colonne. Jetons de couleur et polices : css/theme.css. Ordinateur : css/zz-desktop.css (≥ 1024 px seulement). */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;background:var(--bg);color-scheme:dark}
html[data-theme="light"]{color-scheme:light}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent;background:none;border:0;padding:0}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{font-family:var(--font-display);font-weight:700;letter-spacing:-.01em;line-height:1.15;text-wrap:balance}
h1{font-size:clamp(26px,7vw,34px)} h2{font-size:21px} h3{font-size:17px}
a{color:var(--gold)}
img{max-width:100%;display:block}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px;border-radius:8px}
.skip{position:absolute;left:-999px;top:8px;z-index:100;padding:10px 14px;border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.skip:focus{left:12px}
.muted{color:var(--ink-2)} .small{font-size:13px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.link{color:var(--gold);text-decoration:underline;text-underline-offset:3px;min-height:32px}

/* ── Ciel de fond ─────────────────────────────────────── */
.sky{position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 50% -10%,var(--bg-2),transparent 70%),var(--bg)}

/* ── En-tête ──────────────────────────────────────────── */
.bar{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.bar-in{max-width:640px;margin-inline:auto;padding:8px 16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:56px}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink);text-decoration:none;min-height:44px}
.brand-mark{width:32px;height:32px;flex:none;color:var(--gold)}
.brand-word{font-family:var(--font-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.bar-right{display:flex;align-items:center;gap:8px}

/* ── Vues ─────────────────────────────────────────────── */
.wrap{max-width:640px;margin-inline:auto;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));outline:none}
.view-in{display:flex;flex-direction:column;gap:16px}
.view:not([hidden]) .view-in{animation:viewIn .35s var(--out) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{margin-top:40px;padding:16px 4px 8px;border-top:1px solid var(--line);color:var(--ink-3);font-size:12.5px;display:flex;flex-direction:column;gap:6px;text-align:center}

/* ── Barre du bas ─────────────────────────────────────── */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;padding:6px max(6px,env(safe-area-inset-left,0px)) calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid var(--line)}
.nav-brand,.nav-settings{display:none!important}
.nav button{flex:1;max-width:96px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;padding-bottom:4px;border-radius:var(--r-md);color:var(--ink-3);font-size:11.5px;font-weight:700;transition:color .2s}
.nav button[aria-current="page"]{color:var(--gold)}
.nav button:active{transform:scale(.95)}
.nav-scan .nav-orb{display:grid;place-items:center;width:52px;height:52px;margin-top:-22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-2));color:var(--accent-ink);box-shadow:0 0 0 4px var(--bg),var(--shadow);font-style:normal}
.nav-scan[aria-current="page"] .nav-orb{box-shadow:0 0 0 4px var(--bg),0 0 22px var(--gold)}
.nav-scan svg.i{width:26px;height:26px}

/* ── Boutons ──────────────────────────────────────────── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s,background .2s,border-color .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:linear-gradient(180deg,var(--gold),var(--gold-2));border-color:transparent;color:var(--accent-ink)}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn-danger{color:var(--bad);border-color:var(--bad-soft)}
.btn-block{width:100%}
.btn-icon{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);flex:none;transition:transform .15s,background .2s}
.btn-icon:active{transform:scale(.94)}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}

/* ── Champs ───────────────────────────────────────────── */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.label{font-size:13px;font-weight:700;color:var(--ink-2)}
.input,.select,textarea.input{width:100%;min-height:44px;padding:10px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:16px}
textarea.input{min-height:120px;resize:vertical;line-height:1.4}
.input:focus,.select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--ring)}
.select{appearance:none;padding-right:38px;background-image:linear-gradient(45deg,transparent 50%,var(--ink-2) 50%),linear-gradient(135deg,var(--ink-2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat}
.search{position:relative;display:flex;align-items:center}
.search>svg.i{position:absolute;left:13px;color:var(--ink-3);pointer-events:none}
.search .input{padding-left:42px;border-radius:99px}

/* Interrupteur : <label class="switch"><input type="checkbox"><span>Texte</span></label> */
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px;cursor:pointer}
.switch input{appearance:none;flex:none;order:2;width:48px;height:28px;margin:0;border-radius:99px;background:var(--surface-3);border:1px solid var(--line);position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--ink-2);transition:transform .25s var(--spring),background .2s}
.switch input:checked{background:var(--gold-soft);border-color:var(--gold)}
.switch input:checked::after{transform:translateX(20px);background:var(--gold)}

/* Segments : <div class="seg" role="radiogroup"><button aria-pressed="true">…</button></div> */
.seg{display:flex;padding:3px;gap:2px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line)}
.seg>button{flex:1;min-height:38px;padding:0 12px;border-radius:99px;color:var(--ink-2);font-weight:700;font-size:13.5px;white-space:nowrap}
.seg>button[aria-pressed="true"],.seg>button[aria-checked="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* Puces */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:none;min-height:36px;padding:0 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:700;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-soft);color:var(--ink)}
.chip svg{width:18px;height:18px}

/* Onglets */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs>button{flex:none;min-height:44px;padding:0 14px;color:var(--ink-2);font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs>button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--gold)}

/* ── Contenus ─────────────────────────────────────────── */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%;color:inherit}
.row:last-child{border-bottom:0}
button.row:active{background:var(--surface-2)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.row-title{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-sub{font-size:13px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{flex:none;display:flex;align-items:center;gap:8px;color:var(--ink-2)}
.row .card-thumb{width:44px;flex:none}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;padding:36px 16px;text-align:center;color:var(--ink-2)}
.empty svg.i{width:44px;height:44px;color:var(--gold);stroke-width:1.4}
.empty h3{color:var(--ink)}
.sk{border-radius:var(--r-sm);background:linear-gradient(100deg,var(--surface-2) 40%,var(--surface-3) 50%,var(--surface-2) 60%) 0 0/300% 100%;animation:sk 1.4s linear infinite;min-height:14px}
@keyframes sk{to{background-position:-150% 0}}

/* Cartes : vignette 63:88 (format d'une carte), badges quantité / foil */
.grid-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.card-thumb{position:relative;display:block;aspect-ratio:63/88;border-radius:5%/3.6%;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow);color:inherit;width:100%}
.card-thumb img{width:100%;height:100%;object-fit:cover}
.card-thumb.is-missing img{filter:grayscale(1) brightness(.6)}
.card-thumb .qty{position:absolute;right:5px;bottom:5px;min-width:26px;height:24px;padding:0 7px;border-radius:99px;background:var(--scrim);color:#fff;font-size:12.5px;font-weight:800;display:grid;place-items:center;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.card-thumb .foil{position:absolute;left:5px;top:5px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,var(--amethyst),var(--sapphire),var(--emerald),var(--amber));color:#fff}
.card-thumb .foil svg{width:14px;height:14px}
.card-cap{font-size:12px;color:var(--ink-3);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Compteur − n + */
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:99px;background:var(--surface-2)}
.stepper button{width:44px;height:44px;display:grid;place-items:center;color:var(--ink)}
.stepper output,.stepper .n{min-width:28px;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}

/* ── Surcouches : feuille du bas (.sheet) et plein écran (.screen) ── */
#layer{position:relative;z-index:50}
.ov{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.ov-scrim{position:absolute;inset:0;background:var(--scrim);animation:fade .25s ease both}
.ov.closing .ov-scrim{animation:fade .2s ease reverse both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{position:relative;width:100%;max-width:640px;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;box-shadow:var(--shadow-lg);animation:sheetIn .35s var(--out) both;outline:none}
.ov.closing .sheet{animation:sheetOut .22s ease-in both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.sheet-grip{flex:none;height:24px;display:grid;place-items:center;touch-action:none;cursor:grab}
.sheet-grip::before{content:'';width:40px;height:5px;border-radius:99px;background:var(--line)}
.sheet-head{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 12px 8px 20px}
.sheet-head h2{font-size:19px}
.sheet-body{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 20px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg);animation:screenIn .3s var(--out) both;outline:none}
.ov.closing .screen{animation:screenOut .2s ease-in both}
@keyframes screenIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
@keyframes screenOut{to{opacity:0;transform:translateX(24px)}}
.screen-head{flex:none;display:flex;align-items:center;gap:8px;padding:calc(6px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));min-height:56px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 88%,transparent)}
.screen-head h2{flex:1;min-width:0;font-size:19px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen-head .btn-icon{border:0;background:transparent}
.screen-body{flex:1;overflow-y:auto;overscroll-behavior:contain}
.screen-in{max-width:640px;margin-inline:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}

/* ── Toasts ───────────────────────────────────────────── */
#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
.toast{pointer-events:auto;display:flex;align-items:center;gap:12px;max-width:520px;min-height:48px;padding:8px 8px 8px 16px;border-radius:var(--r-md);background:var(--surface-2);color:var(--ink);border:1px solid var(--line);font-weight:600;box-shadow:var(--shadow-lg);animation:toastIn .3s var(--spring) both}
.toast.out{animation:fade .2s ease reverse both}
.toast:not(:has(button)){padding-right:16px}
.toast button{min-height:36px;padding:0 12px;border-radius:10px;color:var(--gold);font-weight:800;background:transparent}
@keyframes toastIn{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}

/* Cartes : vignettes (viewer.js › thumbHtml), carte en grand (openCard), symboles d'encre, raretés, choix d'une carte. */
.ct-wrap{min-width:0}
.ct-ph{position:absolute;inset:0;display:grid;place-items:center;padding:8px;text-align:center;font-size:12px;color:var(--ink-3)}
.card-thumb.pop{animation:ctPop .35s var(--spring)}
@keyframes ctPop{40%{transform:scale(.92)}}
.ink-sym{width:20px;height:20px;flex:none;color:var(--c,currentColor)}
.ink-sym[data-ink="amber"]{--c:var(--amber)} .ink-sym[data-ink="amethyst"]{--c:var(--amethyst)} .ink-sym[data-ink="emerald"]{--c:var(--emerald)}
.ink-sym[data-ink="ruby"]{--c:var(--ruby)} .ink-sym[data-ink="sapphire"]{--c:var(--sapphire)} .ink-sym[data-ink="steel"]{--c:var(--steel)}
.rar{font-weight:700;color:var(--rc,var(--ink-2))}
.rar[data-rar="common"],.rar-dot[data-rar="common"]{--rc:var(--r-common)} .rar[data-rar="uncommon"],.rar-dot[data-rar="uncommon"]{--rc:var(--r-uncommon)}
.rar[data-rar="rare"],.rar-dot[data-rar="rare"]{--rc:var(--r-rare)} .rar[data-rar="super"],.rar-dot[data-rar="super"]{--rc:var(--r-super)}
.rar[data-rar="legendary"],.rar-dot[data-rar="legendary"]{--rc:var(--r-legendary)} .rar[data-rar="epic"],.rar-dot[data-rar="epic"]{--rc:var(--r-epic)}
.rar[data-rar="enchanted"],.rar-dot[data-rar="enchanted"]{--rc:var(--r-enchanted)} .rar[data-rar="iconic"],.rar-dot[data-rar="iconic"]{--rc:var(--r-iconic)}
.rar[data-rar="special"],.rar-dot[data-rar="special"]{--rc:var(--r-special)}
.rar-dot{width:9px;height:9px;border-radius:50%;background:var(--rc);flex:none}
svg.flip{transform:scaleX(-1)}
.good{color:var(--good)} .bad{color:var(--bad)}

.card-screen .screen-head .btn-icon[data-nav]{border:1px solid var(--line)}
.cv{display:flex;flex-direction:column;gap:18px}
.cv-img{width:min(100%,420px);margin-inline:auto;aspect-ratio:63/88;border-radius:4.5%/3.3%;overflow:hidden;background:var(--surface-2);box-shadow:var(--shadow-lg);touch-action:pan-y}
.cv-img img{width:100%;height:100%;object-fit:cover}
.cv-info{display:flex;flex-direction:column;gap:12px}
.cv-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.cv-name{font-size:24px}
.cv-ver{font-family:var(--font-display);font-style:italic;color:var(--ink-2);font-size:17px}
.cv-inks{display:flex;gap:4px}
.cv-inks .ink-sym{width:28px;height:28px}
.cv-stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.cv-cost{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--gold-soft);border:1px solid var(--gold);font-family:var(--font-display);font-weight:800;font-size:18px;color:var(--gold)}
.cv-tag{display:inline-flex;align-items:center;gap:5px;min-height:30px;padding:0 10px;border-radius:99px;background:var(--surface-2);font-size:13px;font-weight:700;color:var(--ink-2)}
.cv-tag.dim{color:var(--ink-3)}
.cv-tag svg.i{width:16px;height:16px;color:var(--gold)}
.cv-pxs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.cv-px{display:flex;flex-direction:column;padding:10px 14px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line)}
.cv-px span{font-size:12.5px;color:var(--ink-3)}
.cv-px b{font-size:20px}
.cv-own{display:flex;flex-direction:column;gap:6px}
.cv-own-row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:700}
.cv-text summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--ink-2)}
.cv-text p{line-height:1.5}
.cv-src{text-align:center}

.pick-sheet .grid-cards{grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pick-sheet .card-cap{text-align:center}
.add-opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.add-opts .switch{flex:1;min-width:140px}
.add-opts .select{flex:1;min-width:150px}

@media (min-width:1024px){
  .cv{display:grid;grid-template-columns:minmax(280px,420px) 1fr;align-items:start;gap:32px}
  .pick-sheet .grid-cards{grid-template-columns:repeat(5,minmax(0,1fr))}
}

/* Collection, extensions (masterset), échange, classeur. */
.coll-head{display:flex;flex-direction:column;gap:4px}
.coll-body,.trade-body{display:flex;flex-direction:column;gap:14px}
.coll-tools{display:flex;flex-direction:column;gap:10px}
.coll-tools .chip{padding:0 10px}
.coll-actions{display:flex;gap:8px;align-items:center}
.coll-actions .select{flex:1;min-width:0}
.grid-cards .card-cap{text-align:center}
.imp-bad{max-height:180px;overflow:auto;font-size:12px;background:var(--surface-2);padding:10px;border-radius:var(--r-sm);white-space:pre-wrap}

.bars{display:flex;flex-direction:column;gap:8px}
.bar-row{display:grid;grid-template-columns:minmax(96px,36%) 1fr auto;align-items:center;gap:10px;font-size:14px}
.bar-l{display:flex;align-items:center;gap:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-l .ink-sym{width:16px;height:16px}
.bar-t{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar-t i{display:block;height:100%;border-radius:inherit}

/* Progression (anneau doré) */
.ms-ring{width:44px;height:44px;transform:rotate(-90deg)}
.ms-ring circle{fill:none;stroke-width:3.2}
.ms-ring-bg{stroke:color-mix(in srgb,var(--ink) 14%,transparent)}
.ms-ring-fg{stroke:var(--gold);stroke-linecap:round}
.ms-ring-w{position:relative;flex:none;display:grid;place-items:center}
.ms-ring-w b{position:absolute;font-size:12px}
.ms-head{padding:16px;display:flex;flex-direction:column;gap:8px}
.ms-big{display:flex;align-items:center;gap:14px}
.ms-big .ms-ring{width:64px;height:64px}
.ms-big b{font-family:var(--font-display);font-size:32px;display:block;line-height:1}
.ms-big small{font-size:18px;color:var(--ink-3)}
.ms-host{display:flex;flex-direction:column;gap:14px}

.trade-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.trade-tools .seg:not(.seg-icons){flex:1;min-width:220px}
.seg-icons>button{flex:none;width:44px;padding:0;display:grid;place-items:center}
.seg-icons svg.i{width:20px;height:20px}
.trade-list .row .card-thumb{width:40px}
.tr-qr{display:grid;place-items:center;padding:8px}
.tr-qr svg{width:min(240px,70vw);height:auto;border-radius:12px;background:#fff;padding:6px}
.pub-host{display:flex;flex-direction:column;gap:14px}
.pub-match{padding:14px 16px}

/* Classeur : pages de 3 × 3, défilement horizontal aimanté */
.binder{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;padding-bottom:6px;scrollbar-width:thin;overscroll-behavior-x:contain}
.bnd-page{flex:0 0 100%;scroll-snap-align:center;display:flex;flex-direction:column;gap:6px}
.bnd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px;border-radius:var(--r-lg);background:linear-gradient(160deg,var(--surface-3),var(--surface));border:1px solid var(--line);box-shadow:inset 0 0 0 4px var(--surface-2),var(--shadow)}
.bnd-pocket{aspect-ratio:63/88;border-radius:6px;background:var(--surface-2);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),inset 0 -8px 14px -10px rgba(0,0,0,.4);padding:3px}
.bnd-pocket .card-thumb{box-shadow:none}
.bnd-pocket.is-foil{background:var(--foil)}
.bnd-pocket.is-empty{opacity:.5}
.bnd-no{text-align:center}

@media (min-width:1024px){
  .coll-tools{flex-direction:row;flex-wrap:wrap;align-items:center}
  .coll-tools .search{flex:1;min-width:260px}
  .coll-actions .select{flex:none;width:170px}
  .bnd-page{flex-basis:calc(50% - 7px)}
}

/* ── decks.css : Mes decks, éditeur, import, prix d'une liste (decks.js). Ordinateur : bloc @media à la fin. ── */
.dk-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.dk-cards{display:flex;flex-direction:column;gap:12px}
.dk-card{position:relative;display:flex;align-items:stretch;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.dk-card-open{flex:1;min-width:0;display:flex;align-items:stretch;text-align:left;color:inherit}
.dk-card-open:active{background:var(--surface-2)}
.dk-cover{flex:none;width:86px;min-height:104px;background:var(--surface-2) radial-gradient(circle at 40% 30%,var(--gold-soft),transparent 70%);overflow:hidden}
.dk-cover img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;transform:scale(1.35);transform-origin:50% 18%}
.dk-card-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:12px 6px 12px 14px}
.dk-card-name{font-family:var(--font-display);font-weight:700;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dk-card-meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:13.5px;color:var(--ink-2)}
.dk-card-meta .warn{color:var(--warn)}
.dk-card-own{font-size:13px;color:var(--ink-3)}
.dk-card-own.ok{color:var(--good)}
.dk-more{align-self:center;margin-right:8px;border:0;background:transparent}
.dk-inks{display:inline-flex;gap:3px;align-items:center}
.dk-ideas{display:flex;flex-direction:column;gap:8px;margin-top:8px;text-align:center}
.dk-danger{color:var(--bad)}
.dk-form{display:flex;flex-direction:column;gap:14px}
.dk-bad{padding:10px 12px;border-radius:var(--r-md);background:var(--warn-soft);color:var(--ink)}
.dk-bad ul{margin:6px 0 0;padding-left:18px;font-size:13px;max-height:160px;overflow:auto}
.dk-warn{color:var(--warn);font-weight:700}
.dk-ok{display:flex;align-items:center;gap:8px;color:var(--good);font-weight:700}
.dk-sum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.dk-sum>div{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:var(--r-md);background:var(--surface-2)}
.dk-sum b{font-size:20px}
.dk-grid .card-cap{font-size:11.5px}

/* Éditeur */
.dk-head{display:flex;flex-direction:column;gap:8px}
.dk-head-row{display:flex;align-items:center;gap:14px}
.dk-count{display:flex;align-items:baseline;gap:2px;color:var(--warn)}
.dk-count b{font-family:var(--font-display);font-size:30px;line-height:1}
.dk-count.ok{color:var(--good)}
.dk-count span{color:var(--ink-3);font-weight:700}
.dk-val{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
.dk-val b{font-size:17px}
.dk-problems{margin:0;padding:8px 12px 8px 28px;border-radius:var(--r-md);background:var(--warn-soft);font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.dk-tabs{position:sticky;top:0;z-index:2;background:var(--bg)}
.dk-ed{display:grid;gap:16px}
.dk-pane{display:flex;flex-direction:column;gap:14px;min-width:0}
.dk-pane:not(.on){display:none}
.dk-stats{gap:14px}
.dk-curve{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;height:110px;align-items:end}
.dk-bar{height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.dk-bar i{display:block;width:100%;min-height:2px;border-radius:6px 6px 2px 2px;background:linear-gradient(180deg,var(--gold),var(--gold-2))}
.dk-bar-n{font-size:12px;color:var(--ink-2);min-height:16px}
.dk-bar-k{font-size:12px;font-weight:800;color:var(--ink-3)}
.dk-facts{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--ink-2)}
.dk-facts span{display:inline-flex;align-items:center;gap:5px}
.dk-facts svg.i{width:18px;height:18px;color:var(--gold)}
.dk-group-by{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dk-group-by .seg{width:auto}
.dk-lines{display:flex;flex-direction:column;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);overflow:hidden}
.dk-gh{padding:10px 14px 4px;font-family:var(--font-body);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);display:flex;gap:6px;align-items:baseline}
.dk-line{display:flex;align-items:center;gap:10px;padding:6px 8px 6px 12px;border-bottom:1px solid var(--line)}
.dk-line:last-child{border-bottom:0}
.dk-line .ct-wrap{width:42px;flex:none}
.dk-line .row-main{flex:1;min-width:0;display:flex;flex-direction:column}
.dk-line.is-short .row-title{color:var(--ink-2)}
.dk-line-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.dk-line-meta .ink-sym{width:16px;height:16px}
.dk-cost{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 4px;border-radius:50%;background:var(--surface-3);border:1px solid var(--gold-soft);font-size:12px;font-weight:800;color:var(--gold)}
.dk-short{font-size:12px;font-weight:800;color:var(--warn)}
.dk-line .stepper button{width:40px;height:40px}
.dk-line .stepper button:disabled{opacity:.35}
.dk-miss{gap:10px}
.dk-filters{display:flex;flex-direction:column;gap:10px}
.dk-ink-chips .chip{padding:0 10px}

.dk-selects{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dk-lock:empty{display:none}
.dk-pick{display:flex;flex-direction:column;gap:6px;min-width:0}

.dk-plus{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}

@media (min-width:1024px){
  .dk-cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .dk-tabs [data-tab="deck"]{display:none}
  .dk-ed{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .dk-pane[data-pane="deck"]{display:flex}
  .dk-ed[data-cur="deck"] .dk-pane[data-pane="add"]{display:flex}
  .dk-pane[data-pane="add"],.dk-pane[data-pane="coll"]{grid-column:2;grid-row:1;position:sticky;top:60px;max-height:calc(100vh - 140px);overflow-y:auto;padding-right:4px}
  .dk-pane[data-pane="deck"]{grid-column:1;grid-row:1}
  .dk-pane .dk-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .dk-card-open:hover{background:var(--surface-2)}
}

/* Accueil (home.js) et Réglages / À propos (settings.js). */
.hm-orb{padding:22px 20px 18px;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.hm-kicker{font:700 11.5px/1 var(--font-body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.hm-val{font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1;font-weight:700;font-size:clamp(38px,11vw,52px);line-height:1.05;letter-spacing:-.02em}
.hm-sub{color:var(--ink-2)}
.hm-curve{height:72px;margin:6px -4px 4px}
.val-curve{width:100%;height:100%;display:block}
.hm-orb .btn-row{margin-top:4px}
.hm-install{flex-direction:row;align-items:center;gap:12px}
.hm-install>svg.i{color:var(--gold);width:28px;height:28px}
.hm-install>div{flex:1;min-width:0}
.hm-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hm-tile{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-height:104px;padding:14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--line);text-align:left;box-shadow:var(--shadow);transition:transform .15s}
.hm-tile:active{transform:scale(.97)}
.hm-tile svg.i{width:26px;height:26px;color:var(--gold);margin-bottom:auto}
.hm-tile-t{font-family:var(--font-display);font-weight:700;font-size:16.5px;line-height:1.15}
.hm-tile-s{font-size:12.5px;color:var(--ink-3)}
.hm-tile-gold{background:linear-gradient(160deg,var(--gold-soft),var(--surface) 70%);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.hm-tile-new{position:relative}
.hm-tile-new::after{content:'';position:absolute;top:14px;right:14px;width:9px;height:9px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 4px var(--gold-soft)}
.hm-sets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hm-set{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:var(--r-md);background:var(--surface-2);text-align:center;min-height:44px}
.hm-set .ms-ring{width:52px;height:52px}
.hm-set-n{font-weight:700;font-size:13.5px;line-height:1.2}

.settings-sheet .seg>button{font-size:13px;padding:0 8px}
.about-logo{display:grid;place-items:center;padding:6px 0}
.about-mark{width:120px;height:120px}
.about-legal p{font-size:13.5px;line-height:1.5;color:var(--ink-2)}
.about-credits{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}

@media (min-width:1024px){
  .hm-orb{padding:32px 32px 24px}
  .hm-curve{height:110px}
  .hm-tiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  .hm-tile:hover{transform:translateY(-2px);border-color:var(--gold)}
  .hm-sets{grid-template-columns:repeat(4,minmax(0,1fr))}

/* Compte (cloud.js) : bloc des Réglages, feuille de connexion */
.acct{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r-md);background:var(--surface-2);border:1px solid var(--line)}
.acct-main{flex:1;min-width:0;display:flex;flex-direction:column}
.acct-main .small{overflow:hidden;text-overflow:ellipsis}
.btn-google{background:#fff;color:#1f1f1f;border-color:#dadce0}
.btn-google svg.i{width:20px;height:20px}
.signin-form{display:flex;flex-direction:column;gap:12px}
.signin-form [data-err]:empty{display:none}
.signin-alt{justify-content:center}

/* ── Compteur de lore (lore.js) : plein écran, chiffres géants, deux moitiés face à face ── */
.lore-screen .screen-body{overflow:hidden;display:flex;flex-direction:column}
.lore-screen .screen-in{max-width:none;width:100%;flex:1;min-height:0;padding:0;gap:0}
.lore-board{flex:1;min-height:0;display:grid;grid-template-rows:1fr 1fr;gap:6px;padding:6px max(6px,env(safe-area-inset-right,0px)) 0 max(6px,env(safe-area-inset-left,0px));user-select:none;-webkit-user-select:none;touch-action:manipulation}
.lore-board[data-n="3"],.lore-board[data-n="4"]{grid-template-columns:1fr 1fr}
.lore-board[data-n="3"] .lore-p:last-child{grid-column:1 / -1}
.lore-p{--c:var(--amber);position:relative;min-height:0;border-radius:var(--r-lg);overflow:hidden;isolation:isolate;
  background:radial-gradient(90% 80% at 50% 50%,color-mix(in srgb,var(--c) 30%,var(--surface)) 0%,var(--surface) 75%);border:1px solid color-mix(in srgb,var(--c) 40%,var(--line));transition:box-shadow .3s,border-color .3s}
.lore-p.flip{transform:rotate(180deg)}
.lore-p.is-cur{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold),0 0 24px -6px var(--gold)}
.lore-in{position:absolute;inset:0}
.lore-zone{position:absolute;top:0;bottom:0;width:50%;display:flex;align-items:center;padding:0 6%;color:color-mix(in srgb,var(--ink) 45%,transparent);cursor:pointer;transition:background .15s}
.lore-zone[data-d="-1"]{left:0;justify-content:flex-start}.lore-zone[data-d="1"]{right:0;justify-content:flex-end}
.lore-zone.on{background:color-mix(in srgb,var(--c) 22%,transparent)}
.lore-zone svg.i{width:30px;height:30px}
.lore-mid{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:76%;pointer-events:none;display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.lore-name{display:flex;align-items:center;gap:6px;font-weight:800;font-size:15px;max-width:100%}
.lore-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lore-name .ink-sym{width:20px;height:20px;flex:none;color:var(--c)}
.lore-n{font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1;font-weight:800;font-size:clamp(84px,24vmin,200px);line-height:.95;font-variant-numeric:tabular-nums;color:var(--ink);text-shadow:0 2px 20px color-mix(in srgb,var(--c) 45%,transparent)}
.lore-board[data-n="3"] .lore-n,.lore-board[data-n="4"] .lore-n{font-size:clamp(64px,17vmin,150px)}
.lore-goal{font-size:12.5px;color:var(--ink-3);font-weight:700}
.lore-track{width:min(150px,100%);height:5px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:6px}
.lore-track i{display:block;height:100%;background:linear-gradient(90deg,var(--c),var(--gold));border-radius:inherit;transition:width .3s var(--out)}
.lore-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lore-sr:focus-visible{width:auto;height:auto;clip:auto;left:8px;bottom:8px;padding:6px 10px;border-radius:var(--r-sm);background:var(--surface);z-index:2}
.lore-sr[data-sr="1"]:focus-visible{left:auto;right:8px}
.lore-bar{flex:none;display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px))}
.lore-turn{flex:1;max-width:320px;gap:8px}
.lore-turn span{color:var(--ink-3);font-weight:700}
.lore-turn b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn-icon[disabled]{opacity:.4;pointer-events:none}
svg.i.flip{transform:scaleX(-1)}

/* Victoire : étincelles dorées */
.lore-win{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 62%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .3s ease both}
.lore-win-t{font-family:var(--font-display);font-variation-settings:'SOFT' 100,'WONK' 1;font-weight:800;font-size:clamp(26px,7vw,40px);color:var(--gold);text-align:center;padding:0 12px}
.lore-sparks{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lore-sparks i{position:absolute;left:50%;top:50%;width:14px;height:14px;background:var(--gold);clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);opacity:0;animation:loreSpark 1.6s var(--out) infinite}
.lore-sparks i:nth-child(odd){background:var(--gold-2);width:9px;height:9px}
.lore-sparks i:nth-child(1){--x:-140px;--y:-80px;animation-delay:0s}.lore-sparks i:nth-child(2){--x:120px;--y:-90px;animation-delay:.1s}
.lore-sparks i:nth-child(3){--x:-90px;--y:70px;animation-delay:.2s}.lore-sparks i:nth-child(4){--x:150px;--y:60px;animation-delay:.3s}
.lore-sparks i:nth-child(5){--x:0;--y:-120px;animation-delay:.4s}.lore-sparks i:nth-child(6){--x:-170px;--y:10px;animation-delay:.5s}
.lore-sparks i:nth-child(7){--x:170px;--y:-10px;animation-delay:.6s}.lore-sparks i:nth-child(8){--x:40px;--y:110px;animation-delay:.7s}
.lore-sparks i:nth-child(9){--x:-50px;--y:-140px;animation-delay:.8s}.lore-sparks i:nth-child(10){--x:80px;--y:130px;animation-delay:.9s}
.lore-sparks i:nth-child(11){--x:-120px;--y:120px;animation-delay:1s}.lore-sparks i:nth-child(12){--x:110px;--y:-140px;animation-delay:1.1s}
.lore-sparks i:nth-child(13){--x:-30px;--y:90px;animation-delay:1.2s}.lore-sparks i:nth-child(14){--x:200px;--y:100px;animation-delay:1.3s}
@keyframes loreSpark{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(0)}25%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.1) rotate(160deg)}}
@media (prefers-reduced-motion: reduce){.lore-sparks i{animation:none;opacity:.8;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y)))}.lore-track i{transition:none}}

/* Réglages de la partie */
.lore-set-players{display:flex;flex-direction:column;gap:14px}
.lore-inks{display:flex;gap:6px;flex-wrap:wrap}
.lore-ink{--c:var(--amber);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:2px solid transparent;background:var(--surface-2)}
.lore-ink .ink-sym{width:24px;height:24px;color:var(--c)}
.lore-ink[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface-2))}

@media (min-width:1024px){
  .lore-board{padding:10px 10px 0}
  .lore-board[data-n="2"]{grid-template-rows:1fr;grid-template-columns:1fr 1fr}
  .lore-p.flip{transform:none}      /* sur ordinateur, pas de table : personne n'est en face */
  .lore-zone:hover{background:color-mix(in srgb,var(--c) 12%,transparent)}
}

/* ── Carte mystère (mystery.js) ── */
.mys{display:flex;flex-direction:column;align-items:center;gap:16px}
.mys-stage{width:min(260px,68vw);padding:10px;display:flex;flex-direction:column;gap:10px;align-items:center}
.mys-cv{display:block;width:100%;height:auto;aspect-ratio:63/88;border-radius:5%/3.6%;background:var(--surface-2);image-rendering:pixelated}
.mys-steps{display:flex;gap:6px}
.mys-steps i{width:22px;height:8px;border-radius:99px;background:var(--surface-3);border:1px solid var(--line)}
.mys-steps i.ko{background:var(--amethyst);border-color:transparent}
.mys-steps i.ok{background:var(--emerald);border-color:transparent;box-shadow:0 0 10px var(--emerald)}
.mys-q{font-weight:800;text-align:center;display:flex;flex-direction:column;gap:2px}
.mys-in{width:100%;max-width:420px;display:flex;flex-direction:column;gap:6px}
.mys-sug{display:flex;flex-direction:column;border-radius:var(--r-md);overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.mys-sug:empty{display:none}
.mys-opt{min-height:48px;padding:8px 14px;text-align:left;border-bottom:1px solid var(--line);font-weight:700}
.mys-opt:last-child{border-bottom:0}
.mys-opt:active{background:var(--surface-2)}
.mys-hints{width:100%;max-width:420px;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.mys-hints div{padding:8px 12px;border-radius:var(--r-md);background:var(--surface);border:1px solid var(--line);animation:fade .3s ease both}
.mys-hints dt{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.mys-hints dd{margin:2px 0 0;font-weight:700}
.mys-tries{width:100%;max-width:420px;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.mys-tries li{padding:8px 12px;border-radius:var(--r-sm);font-size:14px;border-left:3px solid var(--amethyst);background:var(--surface)}
.mys-tries li.ok{border-left-color:var(--emerald)}
.mys-end{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.mys-res{font-size:26px;color:var(--gold)}
.mys-name{font-weight:800;font-size:17px}
.mys-next b{color:var(--ink)}
@media (min-width:1024px){
  .mys-stage{width:300px}
  .mys-opt:hover{background:var(--surface-2)}
}

/* ── Scanner (scan.js) : téléphone d'abord, une colonne ; ordinateur : aperçu à gauche, lot à droite ── */
.sc{display:flex;flex-direction:column;gap:14px}
.sc-top{display:flex;flex-direction:column;gap:10px}
.sc-top .seg{max-width:360px}
.sc-main,.sc-left,.sc-right{display:flex;flex-direction:column;gap:12px}
.sc-cam{position:relative;aspect-ratio:3/4;max-height:52vh;max-height:52dvh;width:100%;border-radius:var(--r-lg);overflow:hidden;background:radial-gradient(120% 80% at 50% 0%,var(--surface-2),var(--surface-3));border:1px solid var(--line)}
.sc-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}
.sc-on .sc-cam video{opacity:1}
/* Gabarit : le reste de l'image assombri, coins dorés ; la bande dorée en bas à gauche montre où doit tomber la ligne « 12/204 • FR • 7 » */
.sc-guide{position:absolute;border-radius:4.5%/3.2%;box-shadow:0 0 0 2px var(--gold),0 0 0 100vmax rgba(8,6,20,.45);pointer-events:none;opacity:0;transition:opacity .3s}
.sc-on .sc-guide{opacity:1}
.sc-foot{position:absolute;left:2%;top:92.5%;width:44%;height:7%;border-radius:4px;border:1.5px dashed var(--gold);opacity:.75}
.sc-idle{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;color:var(--ink-2)}
.sc-idle svg.i{width:48px;height:48px;color:var(--gold);stroke-width:1.4}
.sc-idle p{max-width:30ch}
.sc-on .sc-idle{display:none}
.sc-status{min-height:22px;text-align:center;font-weight:700;color:var(--ink-2)}
.sc-status.bad{color:var(--warn)}
.sc-ctl{display:flex;flex-direction:column;align-items:center;gap:10px}
.sc-start{min-height:56px;padding:0 28px;font-size:16px}
.sc-read{width:76px;height:76px;border-radius:50%;display:grid;place-items:center;border:3px solid var(--gold);background:transparent}
.sc-read i{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--gold),var(--gold-2));box-shadow:0 0 18px var(--gold-soft);transition:transform .12s}
.sc-read:active i{transform:scale(.9)}
.sc-side{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 14px}
.sc-auto{min-height:44px;gap:10px}
.sc-auto input{order:0}
.sc-file{cursor:pointer}
.sc-right .panel-head h2{font-size:19px}
.sc-item{align-items:flex-start}
.sc-item .ct-wrap{width:44px;flex:none}
.sc-item .row-title,.sc-item .row-sub{white-space:normal}
.sc-acts{display:flex;align-items:center;flex-wrap:wrap;gap:4px 14px;margin-top:2px;font-size:13px}
.sc-foil{display:inline-flex;align-items:center;gap:6px;min-height:32px;color:var(--ink-2);cursor:pointer}
.sc-foil input{width:18px;height:18px;accent-color:var(--gold)}
.sc-item .row-end{align-self:center}
.sc-item .stepper button{width:40px;height:40px}
.sc-new{animation:scNew .9s var(--out)}
@keyframes scNew{from{background:var(--gold-soft)}to{background:transparent}}
.sc-empty{padding:16px}
.sc-add{min-height:52px;position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion:reduce){.sc-new{animation:none}.sc-cam video,.sc-guide{transition:none}}

@media (min-width:1024px){
  .sc-main{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;align-items:start}
  .sc-cam{max-height:68vh}
  .sc-right{position:sticky;top:24px}
  .sc-lot{max-height:60vh;overflow-y:auto}
  .sc-add{position:static;box-shadow:none}
  body.locked .sc-ctl,body.locked .sc-add{visibility:hidden}      /* écran ouvert par-dessus (carte en grand) : sa marge du bas laisse voir la vue, pas ses boutons */
}

/* Ordinateur (≥ 1024 px) seulement : rien ici ne touche au rendu du téléphone.
   Navigation en colonne à gauche (logo en haut), contenu plus large, grilles plus denses, feuilles en fenêtres centrées, survols. */
@media (min-width:1024px){
  body{padding-left:232px}
  .bar{display:none}
  .wrap{max-width:1200px;padding:32px 40px 48px}
  .view-in{gap:20px}

  .nav{top:0;right:auto;width:232px;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:4px;padding:20px 14px;border-top:0;border-right:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent)}
  .nav .nav-brand{display:flex!important;align-items:center;gap:10px;padding:4px 10px 22px;color:var(--ink)}

  .nav button:hover{background:var(--surface-2);color:var(--ink)}
  .nav button[aria-current="page"]{background:var(--gold-soft);color:var(--ink)}
  .nav button[aria-current="page"] svg.i{color:var(--gold)}
  .nav-brand{order:-2}
  .nav .nav-settings{display:flex!important;margin-top:auto}
  .nav-scan .nav-orb{width:auto;height:auto;margin:0;background:none;box-shadow:none!important;color:inherit}
  .nav-scan svg.i{width:22px;height:22px}
  .nav button:active{transform:none}

  .grid-cards{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
  .card-thumb{transition:transform .2s var(--out),box-shadow .2s}
  a.card-thumb:hover,button.card-thumb:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg)}

  .ov{align-items:center;padding:32px}
  .sheet{max-width:560px;max-height:min(86vh,820px);border-bottom:1px solid var(--line);border-radius:var(--r-lg);animation:popIn .25s var(--out) both}

}

<!-- icons.html : sprite SVG d'Ink Orbit (logo, symboles des encres, icônes de l'interface), posé par build.mjs à la place du commentaire « icons » de body.html.

    <!-- Logo : une goutte d'encre magique traversée par une orbite d'or, une étoile en satellite -->
    <symbol id="i-logo" viewBox="0 0 100 100">
      <g transform="rotate(-18 50 58)"><ellipse cx="50" cy="58" rx="43" ry="14" fill="none" stroke="url(#ioGold)" stroke-width="3.4"/></g>

  const q = t.indexOf('?');
  return `https://cards.lorcast.io/card/digital/${IMG_SIZES[size] || 'normal'}/crd_${q < 0 ? t : t.slice(0, q)}.avif${q < 0 ? '' : t.slice(q)}`;
}

async function getJson(url) { const r = await fetch(url, { cache: 'no-cache' }); if (!r.ok) throw new Error(url + ' ' + r.status); return r.json(); }
/** Ligne de cards.json + ligne de texte → carte en mémoire (contrat : docs/contrat.md › Données). */
function cardOf(r, t) {
  return { id: r[0], set: r[1], num: r[2], ink: r[3], cost: r[4], inkwell: !!r[5], type: r[6], rar: r[7], str: r[8], wil: r[9], lore: r[10], foil: r[11], img: r[12], core: !!r[13], max: r[14] || 0, pset: r[15],
    name: t ? t[1] : '', ver: t ? t[2] : '', text: t ? t[3] : '', sub: t ? t[4] : '', story: t ? t[5] : '', nameEn: '', verEn: '', key: '' };
}
/** Clé de recherche d'une carte : nom et version dans la langue des cartes et en anglais. */
const searchKey = c => normName(`${c.name} ${c.ver} ${c.nameEn !== c.name ? c.nameEn + ' ' + c.verEn : ''}`);
/** Charge le catalogue (une fois ; les appels suivants attendent le même chargement). */
function dataLoad() {
  if (CARDS.wait) return CARDS.wait;
  const lang = prefs().clang;
  CARDS.wait = (async () => {
    const [cat, tx, pr] = await Promise.all([getJson('data/cards.json'), getJson(`data/cards-${lang}.json`), getJson('data/prices.json').catch(() => null)]);
    const t = new Map(tx.cards.map(x => [x[0], x]));
    CARDS.list = cat.cards.map(r => cardOf(r, t.get(r[0])));
    CARDS.byId = new Map(CARDS.list.map(c => [c.id, c]));
    CARDS.sets = cat.sets.map(s => ({ code: s.c, type: s.t, date: s.d, base: s.b, name: s.n[lang] || s.n.en, nameEn: s.n.en }));
    CARDS.setsByCode = new Map(CARDS.sets.map(s => [s.code, s]));
    CARDS.v = cat.v; CARDS.lang = lang;
    if (lang === 'en') enApply(tx); else setTimeout(() => dataEn().catch(() => {}), 1500);
    for (const c of CARDS.list) c.key = searchKey(c);
    CARDS.ix = cardIndex(CARDS.list);
    if (pr) { PRICES.p = pr.p || {}; PRICES.v = pr.v || ''; PRICES.src = pr.src || {}; }
    CARDS.ready = true;
    document.dispatchEvent(new CustomEvent('io:data'));
  })().catch(e => { CARDS.wait = null; throw e; });
  return CARDS.wait;
}
function enApply(tx) {
  const t = new Map(tx.cards.map(x => [x[0], x]));
  for (const c of CARDS.list) { const e = t.get(c.id); if (e) { c.nameEn = e[1]; c.verEn = e[2]; } }
  CARDS.enLoaded = true;
}
/** Noms anglais (decklists, CSV, recherche en anglais) : chargés après le démarrage, ou tout de suite quand un import en a besoin. */
let enWait = null;
function dataEn() {
  if (CARDS.enLoaded) return Promise.resolve();
  return enWait || (enWait = (async () => {
    await dataLoad(); if (CARDS.enLoaded) return;
    enApply(await getJson('data/cards-en.json'));
    for (const c of CARDS.list) c.key = searchKey(c);
    CARDS.ix = cardIndex(CARDS.list, CARDS.list.map(c => [c, c.nameEn, c.verEn]));
  })().catch(e => { enWait = null; throw e; }));
}

/* ── Recherche ─────────────────────────────────────────────────────────────────────────────────── */
/** Cartes dont le nom (ou la version) contient tous les mots tapés ; « 7 » ou « 7/12 » : numéro ; filtres : { ink, set, rar, type, cost }. */
function cardSearch(q, f = {}, limit = 200) {
  const words = normName(q).split(' ').filter(Boolean), out = [];
  const numQ = /^(\d{1,3}[a-e]?)(?:\s*\/\s*(\w+))?$/.exec(String(q || '').trim());
  for (const c of CARDS.list) {
    if (f.ink != null && f.ink !== '' && !((c.ink >> f.ink) & 1)) continue;
    if (f.set && c.set !== f.set && c.pset !== f.set) continue;
    if (f.rar != null && f.rar !== '' && c.rar !== +f.rar) continue;
    if (f.type != null && f.type !== '' && c.type !== +f.type) continue;
    if (f.cost != null && f.cost !== '' && (+f.cost >= 9 ? c.cost < 9 : c.cost !== +f.cost)) continue;
    if (numQ) { if (String(c.num) !== numQ[1] || (numQ[2] && String(c.set).toLowerCase() !== numQ[2].toLowerCase())) continue; }
    else if (words.length && !words.every(w => c.key.includes(w))) continue;
    out.push(c); if (out.length >= limit) break;
  }
  if (words.length && !numQ) { const k = words.join(' '); out.sort((a, b) => (!normName(a.name).startsWith(k)) - (!normName(b.name).startsWith(k)) || a.id - b.id); }
  return out;
}
/** Ordre des extensions : sortie la plus récente d'abord ; promos (codes P1, C1…) : leur nom lisible. */
const setName = code => { const s = CARDS.setsByCode.get(String(code)); return s ? s.name : T('Promos {code}', { code }); };
const setLabel = c => (CARDS.setsByCode.has(String(c.set)) ? `${c.set} · ${c.num}` : `${c.set} ${c.num}`);
const cardPrice = (c, foil) => priceFor(PRICES.p, c.id, foil, prefs().cur);

/* ── Collection et listes de l'utilisateur ─────────────────────────────────────────────────────── */
const COLL = { map: load('coll', {}), wants: load('wants', {}), hold: load('hold', {}) };
const collSubs = new Set();
/** Écrit la collection et prévient les vues (rendu au prochain affichage). */
function collSave() { save('coll', COLL.map); save('wants', COLL.wants); save('hold', COLL.hold); for (const f of collSubs) { try { f(); } catch (e) { console.error(e); } } }
const onColl = f => collSubs.add(f);
const ownedOf = id => { let n = 0; for (const k of [collKey(id), collKey(id, true)]) n += COLL.map[k] || 0; for (const l of IO_LANGS) n += (COLL.map[collKey(id, false, l)] || 0) + (COLL.map[collKey(id, true, l)] || 0); return n; };


/* ── ui.js : coque de l'appli (vues, barre du bas, surcouches, toasts, formats) ───────────────────────────────────────────────
   · Vues : <section class="view" id="v-<nom>"> de body.html ; showView(nom) en affiche une, onView(nom, fn) rend à la demande (fn(conteneur .view-in, première fois)).
     Vue gardée dans localStorage (inkorbit:view), sauf le scan (jamais la caméra au lancement) ; ?open=<vue> l'impose.
   · Surcouches empilées dans #layer : openSheet (feuille du bas sur téléphone, fenêtre centrée sur ordinateur), openScreen (plein écran).
     Chacune pousse une entrée d'historique : le Retour du téléphone ferme celle du dessus, comme Échap et le fond assombri.
     Accessibilité : role="dialog", aria-modal, focus dans la surcouche (Tab y reste), rendu à l'élément d'avant à la fermeture ; le reste de la page est inerte.
   · [data-act="<nom>"] : onAct(nom, fn) (un seul écouteur sur le document : Réglages, À propos…). */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const VIEWS = ['home', 'coll', 'scan', 'trade', 'decks'];
const UI = { view: '', hooks: {}, seen: new Set(), acts: {}, stack: [] };

function onView(name, fn) { (UI.hooks[name] = UI.hooks[name] || []).push(fn); if (UI.view === name) fn($('#v-' + name + ' .view-in'), false); }
const curView = () => UI.view;
function showView(name) {
  if (!VIEWS.includes(name)) name = 'home';
  const was = UI.view; UI.view = name;
  for (const v of VIEWS) { const el = $('#v-' + v); if (el) el.hidden = v !== name; }
  $$('#nav [data-view]').forEach(b => b.dataset.view === name ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
  if (name !== 'scan') { try { localStorage.setItem('inkorbit:view', name); } catch (e) { /* stockage indisponible */ } }
  if (was !== name) window.scrollTo(0, 0);
  const first = !UI.seen.has(name); UI.seen.add(name);
  for (const fn of UI.hooks[name] || []) { try { fn($('#v-' + name + ' .view-in'), first); } catch (e) { console.error(e); } }
}
const onAct = (name, fn) => { UI.acts[name] = fn; };

/* ── Surcouches ─────────────────────────────────────────────────────────────────────────────────── */
function overlay(kind, { title = '', html = '', cls = '', onClose } = {}) {
  const ov = document.createElement('div'); ov.className = 'ov';
  const id = 'ov' + Date.now().toString(36) + UI.stack.length;
  ov.innerHTML = kind === 'sheet'
    ? `<div class="ov-scrim"></div><div class="sheet ${esc(cls)}" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1"><div class="sheet-grip" aria-hidden="true"></div><div class="sheet-head"><h2 id="${id}">${esc(title)}</h2><button type="button" class="btn-icon" data-close aria-label="${esc(T('Fermer'))}"><svg class="i"><use href="#i-close"/></svg></button></div><div class="sheet-body">${html}</div></div>`
    : `<div class="screen ${esc(cls)}" role="dialog" aria-modal="true" aria-labelledby="${id}" tabindex="-1"><div class="screen-head"><button type="button" class="btn-icon" data-close aria-label="${esc(T('Retour'))}"><svg class="i"><use href="#i-back"/></svg></button><h2 id="${id}">${esc(title)}</h2></div><div class="screen-body"><div class="screen-in">${html}</div></div></div>`;
  const panel = ov.lastElementChild, item = { ov, panel, onClose, back: document.activeElement };
  panel.close = () => closeOverlay(item);
  ov.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.classList.contains('ov-scrim')) closeOverlay(item); });
  if (kind === 'sheet') sheetDrag(item);
  $('#layer').appendChild(ov);
  UI.stack.push(item); layerChanged();
  try { history.pushState({ io: UI.stack.length }, ''); item.hist = true; } catch (e) { /* historique indisponible (aperçu) */ }
  requestAnimationFrame(() => (panel.querySelector('[autofocus]') || panel).focus({ preventScroll: true }));
  return panel;
}
const openSheet = o => overlay('sheet', o);
const openScreen = o => overlay('screen', o);
const closeTop = () => { const it = UI.stack[UI.stack.length - 1]; if (it) closeOverlay(it); };
/** Ferme une surcouche (et celles posées dessus). Fermée par l'appli : l'entrée d'historique est retirée par history.back(), popstate ne refermera rien de plus. */
function closeOverlay(item) {
  const i = UI.stack.indexOf(item); if (i < 0) return;
  const gone = UI.stack.splice(i);
  const hist = gone.filter(x => x.hist).length;
  if (hist) { UI.skipPop = (UI.skipPop || 0) + 1; history.go(-hist); }
  for (const it of gone.reverse()) dropOverlay(it);
  layerChanged();
}
function dropOverlay(it) {
  it.ov.classList.add('closing');
  setTimeout(() => it.ov.remove(), matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 230);
  if (it.back && it.back.isConnected) try { it.back.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  if (it.onClose) try { it.onClose(); } catch (e) { console.error(e); }
}
function layerChanged() {
  const open = UI.stack.length > 0;
  document.body.classList.toggle('locked', open);
  for (const sel of ['#app', '#nav', '#bar']) { const el = $(sel); if (el) el.inert = open; }
  UI.stack.forEach((it, k) => { it.ov.inert = k < UI.stack.length - 1; });
}
/** Feuille du bas : la tirer vers le bas (poignée ou en-tête) la ferme au-delà de 110 px ou d'un geste rapide. */
function sheetDrag(item) {
  const sh = item.panel; let y0 = 0, t0 = 0, dy = 0, on = false;
  const start = e => { if (e.button > 0 || matchMedia('(min-width:1024px)').matches || e.target.closest('button')) return; on = true; y0 = e.clientY; t0 = Date.now(); dy = 0; sh.style.transition = 'none'; e.currentTarget.setPointerCapture(e.pointerId); };
  const move = e => { if (!on) return; dy = Math.max(0, e.clientY - y0); sh.style.transform = `translateY(${dy}px)`; };
  const end = () => { if (!on) return; on = false; sh.style.transition = 'transform .22s ease'; if (dy > 110 || (dy > 40 && dy / (Date.now() - t0) > .6)) closeOverlay(item); else sh.style.transform = ''; };
  for (const h of [$('.sheet-grip', sh), $('.sheet-head', sh)]) { h.addEventListener('pointerdown', start); h.addEventListener('pointermove', move); h.addEventListener('pointerup', end); h.addEventListener('pointercancel', end); }
}

/* ── Toasts ─────────────────────────────────────────────────────────────────────────────────────── */
function toast(msg, { action, onAction, ms = 3600 } = {}) {
  const box = $('#toasts'); if (!box) return null;
  while (box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status');
  el.innerHTML = `<span>${esc(msg)}</span>` + (action ? `<button type="button">${esc(action)}</button>` : '');
  const bye = () => { if (!el.isConnected) return; el.classList.add('out'); setTimeout(() => el.remove(), 200); };
  if (action) el.querySelector('button').addEventListener('click', () => { bye(); if (onAction) onAction(); });
  box.appendChild(el); setTimeout(bye, action ? Math.max(ms, 6000) : ms);
  return el;
}

/* ── Formats ────────────────────────────────────────────────────────────────────────────────────── */
const uiLoc = () => (typeof LOC === 'function' ? LOC() : 'fr-FR');
function prefCur() {
  try { const p = JSON.parse(localStorage.getItem('inkorbit:prefs') || '{}'); if (p.cur === 'EUR' || p.cur === 'USD') return p.cur; } catch (e) { /* ignore */ }
  return typeof I18N !== 'undefined' && I18N.lang === 'en' ? 'USD' : 'EUR';
}
/** Centimes → « 12,34 € » / « $12.34 » (devise des réglages, sinon celle de la langue). cur : imposer une devise. */
const fmtMoney = (cents, cur) => new Intl.NumberFormat(uiLoc(), { style: 'currency', currency: cur || prefCur() }).format((Number(cents) || 0) / 100);
const fmtNum = n => new Intl.NumberFormat(uiLoc()).format(Number(n) || 0);

/* ── Démarrage ──────────────────────────────────────────────────────────────────────────────────── */
function uiInit() {
  if (typeof i18nDom === 'function') i18nDom(document.body);
  document.addEventListener('click', e => {
    const v = e.target.closest('[data-view]');
    if (v) { e.preventDefault(); if (UI.stack.length) closeOverlay(UI.stack[0]); showView(v.dataset.view); return; }      // depuis une surcouche : tout se ferme d'abord
    const a = e.target.closest('[data-act]');
    if (a && UI.acts[a.dataset.act]) { e.preventDefault(); UI.acts[a.dataset.act](a, e); }
  });
  const bs = $('#btnSettings'); if (bs && !bs.dataset.act) bs.dataset.act = 'settings';
  document.addEventListener('keydown', e => {
    const top = UI.stack[UI.stack.length - 1]; if (!top) return;
    if (e.key === 'Escape') { e.preventDefault(); closeOverlay(top); return; }
    if (e.key !== 'Tab') return;      // Tab reste dans la surcouche du dessus
    const f = $$('button,[href],input,select,textarea,[tabindex]:not([tabindex="-1"])', top.panel).filter(x => !x.disabled && x.offsetParent !== null);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && (document.activeElement === first || document.activeElement === top.panel)) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });
  // Retour du téléphone (ou du navigateur) : ferme les surcouches au-dessus de l'entrée d'historique atteinte.
  window.addEventListener('popstate', e => {
    if (UI.skipPop) { UI.skipPop--; return; }
    const depth = (e.state && e.state.io) || 0;
    while (UI.stack.length > depth) { const it = UI.stack.pop(); it.hist = false; dropOverlay(it); }
    layerChanged();
  });
  let start = '';
  try { start = new URLSearchParams(location.search).get('open') || localStorage.getItem('inkorbit:view') || ''; } catch (e) { /* ignore */ }
  showView(VIEWS.includes(start) ? start : 'home');
}


/* ── viewer.js : vignettes de cartes, carte en grand (navigable), choix d'une carte, ajout à la collection ─────────────────────
   · thumbHtml(c, o) : vignette <button class="card-thumb" data-card="<id>"> (image Lorcast, quantité, foil, grisée si manquante).
     Un seul écouteur : toucher une vignette ouvre la carte en grand, précédente / suivante parmi les vignettes du même conteneur [data-cards].

/** Ajoute n exemplaires (n < 0 : retire) ; toast « Annuler ». */

function openCard(id, ids) {
  const list = ids && ids.length ? ids : [id];
  let i = Math.max(0, list.indexOf(id));
  const c0 = CARDS.byId.get(id); if (!c0) return;
  const el = openScreen({ title: c0.name, html: '<div class="cv-host"></div>', cls: 'card-screen' });
  const host = $('.cv-host', el), title = $('.screen-head h2', el);
  if (list.length > 1) $('.screen-head', el).insertAdjacentHTML('beforeend', `<button type="button" class="btn-icon" data-nav="-1" aria-label="${esc(T('Carte précédente'))}"><svg class="i flip"><use href="#i-chev"/></svg></button><button type="button" class="btn-icon" data-nav="1" aria-label="${esc(T('Carte suivante'))}"><svg class="i"><use href="#i-chev"/></svg></button>`);
  const paint = () => { const c = CARDS.byId.get(list[i]); host.innerHTML = cardBodyHtml(c); if (title) title.textContent = c.name; };
  const go = d => { i = (i + d + list.length) % list.length; paint(); };
  el.addEventListener('click', e => {
    const c = CARDS.byId.get(list[i]);

    const st = e.target.closest('.stepper[data-own] [data-d]');
    if (st) { const foil = st.closest('[data-own]').dataset.own === '1', d = +st.dataset.d; if (d < 0 && !(foil ? ownSplit(c.id).f : ownSplit(c.id).n)) return; collRemoveOrAdd(c, d, foil); paint(); return; }
    if (e.target.closest('[data-want]')) { if (COLL.wants[c.id]) delete COLL.wants[c.id]; else COLL.wants[c.id] = 1; collSave(); paint(); }
  });
  el.addEventListener('keydown', e => { if (e.key === 'ArrowLeft') go(-1); else if (e.key === 'ArrowRight') go(1); });
  let x0 = null;      // glisser à gauche / à droite sur l'image : carte suivante / précédente
  host.addEventListener('pointerdown', e => { if (e.target.closest('.cv-img')) x0 = e.clientX; });
  host.addEventListener('pointerup', e => { if (x0 != null && list.length > 1 && Math.abs(e.clientX - x0) > 60) go(e.clientX < x0 ? 1 : -1); x0 = null; });

}
/** Retirer prend d'abord un exemplaire sans langue, puis n'importe quelle langue de la même finition. */
function collRemoveOrAdd(c, d, foil) {
  if (d > 0) { collAdd(COLL.map, collKey(c.id, foil), 1); collSave(); return; }
  const k = [collKey(c.id, foil), ...IO_LANGS.map(l => collKey(c.id, foil, l))].find(x => COLL.map[x] > 0);
  if (k) { collAdd(COLL.map, k, -1); collSave(); }
}

/* ── collection.js : vue « Collection » (onglets Cartes · Extensions · Stats), ajout manuel, import / export CSV ─────────────────
   Source de vérité : COLL.map (data.js), { "<id>[*][@langue]": n } dans localStorage. Les extensions (masterset) : masterset.js › msListHtml / openSet. */
const CV = { tab: 'cards', q: '', ink: '', sort: 'set', show: 300, el: null };

onView('coll', el => { CV.el = el; dataLoad().then(collPaint, () => collFail(el)); if (!CARDS.ready) el.innerHTML = '<div class="sk" style="height:220px"></div>'; });

function collFail(el) { el.innerHTML = `<div class="empty"><svg class="i"><use href="#i-offline"/></svg><h3>${esc(T('Catalogue indisponible'))}</h3><p>${esc(T('Connecte-toi une première fois pour télécharger les cartes.'))}</p></div>`; }

/** Lignes de la collection groupées par carte : [{ c, n, f }] (n : total, f : dont foil). */
function collRows() {
  const out = [];

}
function collSorted() {

  const px = r => priceFor(PRICES.p, r.c.id, r.f > 0 && r.f === r.n, cur);
  const by = { set: (a, b) => a.c.id - b.c.id, name: (a, b) => a.c.name.localeCompare(b.c.name, I18N.lang) || a.c.id - b.c.id, price: (a, b) => px(b) - px(a), cost: (a, b) => a.c.cost - b.c.cost || a.c.id - b.c.id, qty: (a, b) => b.n - a.n || a.c.id - b.c.id }[CV.sort];

}

function downloadText(name, text, type = 'text/plain') {

function openImport() {

/* ── Stats ──────────────────────────────────────────────────────────────────────────────────── */
function collStatsHtml(rows) {
  if (!rows.length) return `<p class="muted">${esc(T('Ajoute des cartes pour voir tes statistiques.'))}</p>`;
  const cur = prefs().cur, ink = INK_KEYS.map(() => 0), rar = RAR_KEYS.map(() => 0);

  for (const r of rows) { total += r.n; foil += r.f; for (const i of inksOf(r.c.ink)) ink[i] += r.n; rar[r.c.rar] += r.n; }
  const bars = (vals, names, keys, cls) => { const max = Math.max(1, ...vals); return `<div class="bars">${vals.map((v, i) => v ? `<div class="bar-row"><span class="bar-l">${cls === 'ink' ? `<svg class="ink-sym" data-ink="${keys[i]}"><use href="#ink-${keys[i]}"/></svg>` : ''}${esc(names[i])}</span><span class="bar-t"><i style="width:${(v / max * 100).toFixed(1)}%;background:var(--${cls === 'ink' ? keys[i] : 'r-' + keys[i]})"></i></span><b class="num">${fmtNum(v)}</b></div>` : '').join('')}</div>`; };
  const top = rows.map(r => ({ ...r, px: priceFor(PRICES.p, r.c.id, r.f > 0, cur) })).sort((a, b) => b.px - a.px).slice(0, 12);

    <div class="panel"><h3>${esc(T('Les plus chères'))}</h3><div class="grid-cards" data-cards>${top.map(r => thumbHtml(r.c, { qty: r.n, foil: r.f > 0, size: 'small', cap: `<b class="num">${fmtMoney(r.px, cur)}</b>` })).join('')}</div></div>`;
